<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="0;url=/login.html">
  <title>Opening EqualLearn Login…</title>
  <script>
    (function () {
      // There is no longer a separate Evaluation Mode screen or role picker.
      // All users use the normal login form; demoReadOnly is detected from
      // users/{uid} immediately after Firebase authentication succeeds.
      var target = "/login.html";
      try {
        if (window.self === window.top) {
          window.location.replace("/app.html?path=" + encodeURIComponent(target));
        } else {
          window.location.replace(target);
        }
      } catch (_) {
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <p>Opening the EqualLearn sign-in page…</p>
</body>
</html>
