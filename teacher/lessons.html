
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">

    <title>Manage Lessons - EqualLearn</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/equallearn.css">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../assets/icons/equallearn-logo.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: inherit;
            background: #0b1020;
        }

        .page {
            width: 100%;
            max-width: 1480px;
            margin: auto;
            padding: 35px 25px 60px;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .header-left h1 {
            margin: 0;
            color: #ffffff;
            font-size: 32px;
        }

        .header-left p {
            margin: 6px 0 0;
            color: #aab7d0;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .back-btn,
        .add-btn {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .back-btn {
            background: #25204d;
            color: #c5beff;
        }

        .add-btn {
            background: linear-gradient(135deg, #635bff, #8b5cf6);
            color: #ffffff;
        }

        .back-btn:hover,
        .add-btn:hover {
            filter: brightness(1.12);
        }

        /* LESSON CARD */
        .lesson-card {
            background: #111a2e !important;
            color: #f8fafc !important;
            border: 1px solid #263550 !important;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,.16);
        }

        .lesson-card h2 {
            margin: 0 0 8px;
            font-size: 21px;
            color: #ffffff !important;
        }

        .lesson-description {
            color: #cbd5e1 !important;
            margin: 0 0 15px;
            line-height: 1.6;
        }

        .module-badge {
            display: inline-block;
            background: #25204d !important;
            color: #c5beff !important;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .lesson-category {
            margin-left: 6px;
            background: #183449 !important;
            color: #9de4ff !important;
        }

        .file-info {
            background: #18243b !important;
            border: 1px solid #30415f;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            color: #e2e8f0 !important;
            font-size: 14px;
        }

        .file-info strong {
            color: #ffffff !important;
        }

        .file-info a,
        .video-info a {
            color: #a99fff !important;
            text-decoration: underline;
        }

        .file-info small {
            color: #aab7d0 !important;
        }

        .video-info {
            margin-top: 10px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .edit-btn {
            background: #25204d !important;
            color: #c5beff !important;
        }

        .delete-btn {
            background: #44202b !important;
            color: #ffb7c0 !important;
        }

        .edit-btn:hover,
        .delete-btn:hover {
            filter: brightness(1.15);
        }

        /* EMPTY / LOADING */
        .message-box {
            background: #111a2e !important;
            border: 1px solid #263550 !important;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            color: #aab7d0 !important;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.72);
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 100%;
            max-width: 550px;
            background: #111a2e !important;
            color: #f8fafc !important;
            border: 1px solid #30415f !important;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            color: #ffffff !important;
        }

        .close-btn {
            border: none;
            background: #25204d;
            color: #ffffff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: #e5ecf8 !important;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #30415f !important;
            border-radius: 10px;
            background: #0b1427 !important;
            color: #f8fafc !important;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #8291aa;
        }

        .form-group select option {
            background: #111a2e;
            color: #ffffff;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #756bff !important;
            box-shadow: 0 0 0 3px rgba(99,91,255,.18);
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .file-help {
            margin-top: 6px;
            font-size: 12px;
            color: #aab7d0;
        }

        .upload-status {
            margin-top: 8px;
            font-size: 13px;
            color: #a99fff;
        }

        .current-file {
            background: #18243b !important;
            border: 1px solid #30415f;
            padding: 10px;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 13px;
            color: #e2e8f0 !important;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-btn,
        .save-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .cancel-btn {
            background: #263550 !important;
            color: #ffffff !important;
        }

        .save-btn {
            background: #635bff !important;
            color: #ffffff !important;
        }

        .save-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .page {
                padding: 25px 15px 50px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .header-buttons {
                width: 100%;
            }

            .back-btn,
            .add-btn {
                flex: 1;
            }

            .modal {
                align-items: flex-start;
                padding-top: 30px;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="../assets/css/responsive-layout.css">
</head>

<body>

    <div class="page">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <h1>Lessons</h1>
                <p>Create and manage lessons for your students.</p>
            </div>

            <div class="header-buttons">
                <button
                    class="back-btn"
                    type="button"
                    onclick="window.location.href='dashboard.html'">
                    ← Back
                </button>

                <button
                    class="add-btn"
                    type="button"
                    id="openModal">
                    + Add Lesson
                </button>
            </div>
        </div>

        <!-- LESSON LIST -->
        <div id="lessonList">
            <div class="message-box">
                Loading lessons...
            </div>
        </div>

    </div>

    <!-- ADD / EDIT MODAL -->
    <div class="modal" id="lessonModal">

        <div class="modal-content">

            <div class="modal-header">
                <h2 id="modalTitle">Add Lesson</h2>

                <button
                    class="close-btn"
                    type="button"
                    id="closeModal">
                    ×
                </button>
            </div>

            <!-- MODULE -->
            <div class="form-group">
                <label for="moduleSelect">Module</label>

                <select id="moduleSelect">
                    <option value="">Loading modules...</option>
                </select>
            </div>

            <!-- CATEGORY -->
            <div class="form-group">
                <label for="lessonCategory">Category</label>
                <select id="lessonCategory" required>
                    <option value="Lesson">Lesson</option>
                    <option value="Reading Material">Reading Material</option>
                    <option value="Practice">Practice</option>
                    <option value="Assessment">Assessment</option>
                    <option value="Performance Task">Performance Task</option>
                    <option value="General">General</option>
                </select>
            </div>

            <!-- TITLE -->
            <div class="form-group">
                <label for="lessonTitle">Lesson Title</label>

                <input
                    type="text"
                    id="lessonTitle"
                    placeholder="Example: What is Gender Equality?">
            </div>

            <!-- DESCRIPTION -->
            <div class="form-group">
                <label for="lessonDescription">Description</label>

                <textarea
                    id="lessonDescription"
                    placeholder="Enter lesson description..."></textarea>
            </div>

            <!-- FILE -->
            <div class="form-group">
                <label for="lessonFile">Lesson File</label>

                <input
                    type="file"
                    id="lessonFile"
                    accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.jpg,.jpeg,.png">

                <div class="file-help">
                    Supported: PDF, Word, PowerPoint, Excel, TXT and images.
                    Maximum file size: 20 MB. Files are securely uploaded to Firebase Storage.
                </div>

                <div
                    class="current-file"
                    id="currentFile"
                    style="display:none;">
                </div>

                <div
                    class="upload-status"
                    id="uploadStatus">
                </div>
            </div>

            <!-- YOUTUBE -->
            <div class="form-group">
                <label for="videoUrl">
                    YouTube Link
                    <span style="font-weight:400;color:#aab7d0;">
                        (Optional)
                    </span>
                </label>

                <input
                    type="url"
                    id="videoUrl"
                    placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <!-- ACTIONS -->
            <div class="modal-actions">
                <button
                    class="cancel-btn"
                    type="button"
                    id="cancelBtn">
                    Cancel
                </button>

                <button
                    class="save-btn"
                    type="button"
                    id="saveLesson">
                    Save Lesson
                </button>
            </div>

        </div>
    </div>

    <!-- EXISTING JAVASCRIPT -->
    <script type="module" src="../assets/js/teacher-lessons.js"></script>
    <script type="module" src="../assets/js/ui-shell.js"></script>
    <script type="module" src="../assets/js/pwa.js"></script>
    <script type="module" src="../assets/js/theme.js"></script>

<!-- EQUALLEARN LUMI COMPANION -->
<iframe
  src="../assets/widgets/lumi.html"
  title="Lumi — EqualLearn Companion"
  id="equallearn-lumi-frame"
  allow="autoplay"
  style="
    position: fixed;
    right: 8px;
    bottom: 8px;
    width: 210px;
    height: 255px;
    border: 0;
    background: transparent;
    z-index: 99999;
    overflow: hidden;
    pointer-events: auto;
  ">
</iframe>


</body>
</html>
