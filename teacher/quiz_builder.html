
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#635bff">

  <title>Quiz Builder | EqualLearn</title>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../assets/css/equallearn.css">
  <link rel="icon" href="../assets/icons/icon-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ECECFF;
      font-family: inherit;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 950px;
      margin: auto;
      padding: 35px 25px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0;
      color: #6C63FF;
    }

    .header p {
      color: #666;
      margin: 5px 0 0;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .back-btn,
    .add-btn {
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 600;
    }

    .back-btn {
      background: #dddfff;
      color: #6C63FF;
    }

    .add-btn {
      background: #6C63FF;
      color: white;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
    }

    .question-card {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
    }

    .question-number {
      color: #6C63FF;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .question-text {
      font-weight: 600;
      margin-bottom: 15px;
    }

    .choices {
      display: grid;
      gap: 8px;
    }

    .choice {
      padding: 10px;
      background: #F6F6FF;
      border-radius: 9px;
    }

    .delete {
      width: 100%;
      border: none;
      padding: 11px;
      margin-top: 15px;
      border-radius: 9px;
      color: white;
      background: #F44336;
      font-weight: 600;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      margin: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close-btn {
      border: none;
      background: #eee;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-size: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-family: inherit;
      margin-bottom: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-group {
      margin-top: 15px;
    }

    .save-btn {
      width: 100%;
      border: none;
      padding: 14px;
      background: #6C63FF;
      color: white;
      border-radius: 10px;
      font-weight: 600;
    }

    .cancel-btn {
      width: 100%;
      border: none;
      padding: 13px;
      background: #eee;
      color: #444;
      border-radius: 10px;
      margin-top: 10px;
    }

    .section-description {
      color: #777;
      font-size: 14px;
      margin-top: -5px;
      margin-bottom: 15px;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fff3cd;
      color: #856404;
    }

    @media(max-width:600px) {
      .page {
        padding: 22px 15px 50px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-buttons {
        width: 100%;
      }

      .back-btn,
      .add-btn {
        flex: 1;
      }

      .modal-content {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="header">

    <div>
      <h1>Quiz Builder</h1>
      <p>Create and manage quizzes for your lessons.</p>
    </div>

    <div class="header-buttons">

      <button
        type="button"
        class="back-btn"
        onclick="window.location.href='dashboard.html'">
        ← Back
      </button>

      <button
        type="button"
        id="openModal"
        class="add-btn">
        + Create Quiz
      </button>

    </div>

  </div>

  <!-- QUIZ INFORMATION -->

  <div class="card">

    <h2>Quiz Information</h2>

    <p class="section-description">
      Filter your questions by lesson.
    </p>

    <label for="lessonFilter">Filter by Lesson</label>

    <select id="lessonFilter">
      <option value="">All Lessons</option>
    </select>

  </div>

  <!-- QUESTIONS -->

  <div class="card">

    <h2>Questions and Quizzes</h2>

    <div id="questionList">
      <div class="empty">
        Loading questions...
      </div>
    </div>

  </div>

</div>

<!-- CREATE QUIZ MODAL -->

<div class="modal" id="quizModal">

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="modalTitle">Create Quiz</h2>

      <button
        type="button"
        class="close-btn"
        id="closeModal">
        ×
      </button>

    </div>

    <!-- LESSON -->

    <div class="form-group">

      <label for="lessonSelect">Select Lesson</label>

      <select id="lessonSelect" required>
        <option value="">Loading lessons...</option>
      </select>

    </div>

    <!-- QUIZ TYPE -->

    <div class="form-group">

      <label for="quizMode">Quiz Type</label>

      <select id="quizMode">
        <option value="native">Create Quiz Here</option>
        <option value="external">External Quiz Link</option>
      </select>

    </div>

    <!-- EXTERNAL QUIZ -->

    <div id="externalFields" style="display:none;">

      <h3>External Quiz</h3>

      <p class="section-description">
        Add a Google Forms, Quizizz, or other quiz link.
      </p>

      <div class="form-group">

        <label for="externalQuizTitle">Quiz Title</label>

        <input
          type="text"
          id="externalQuizTitle"
          placeholder="Example: Lesson 1 Quiz">

      </div>

      <div class="form-group">

        <label for="externalQuizUrl">Quiz URL</label>

        <input
          type="url"
          id="externalQuizUrl"
          placeholder="https://...">

      </div>

      <div class="form-group">

        <label for="externalQuizDescription">Description</label>

        <textarea
          id="externalQuizDescription"
          placeholder="Enter quiz instructions..."></textarea>

      </div>

    </div>

    <!-- NATIVE QUIZ -->

    <div id="nativeFields">

      <h3>Multiple Choice Question</h3>

      <p class="section-description">
        Create a question with four choices.
      </p>

      <div class="form-group">

        <label for="question">Question</label>

        <textarea
          id="question"
          placeholder="Enter your question..."></textarea>

      </div>

      <div class="form-group">

        <label for="choiceA">Choice A</label>

        <input
          type="text"
          id="choiceA"
          placeholder="Enter choice A">

      </div>

      <div class="form-group">

        <label for="choiceB">Choice B</label>

        <input
          type="text"
          id="choiceB"
          placeholder="Enter choice B">

      </div>

      <div class="form-group">

        <label for="choiceC">Choice C</label>

        <input
          type="text"
          id="choiceC"
          placeholder="Enter choice C">

      </div>

      <div class="form-group">

        <label for="choiceD">Choice D</label>

        <input
          type="text"
          id="choiceD"
          placeholder="Enter choice D">

      </div>

      <div class="form-group">

        <label for="correctAnswer">Correct Answer</label>

        <select id="correctAnswer">
          <option value="">Select correct answer</option>
          <option value="A">Choice A</option>
          <option value="B">Choice B</option>
          <option value="C">Choice C</option>
          <option value="D">Choice D</option>
        </select>

      </div>

    </div>

    <button
      type="button"
      class="save-btn"
      id="saveQuestion">
      Save
    </button>

    <button
      type="button"
      class="cancel-btn"
      id="cancelModal">
      Cancel
    </button>

  </div>

</div>

<script type="module" src="../assets/js/quiz-builder.js"></script>
<script type="module" src="../assets/js/ui-shell.js"></script>
<script type="module" src="../assets/js/pwa.js"></script>
<script type="module" src="../assets/js/theme.js"></script>

</body>
</html>
