<!DOCTYPE html>
<html lang="en">
<head>
  <script id="EQUALLEARN_FORCE_DARK_BOOTSTRAP">document.documentElement.dataset.theme="dark";document.documentElement.style.colorScheme="dark";</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Admin Content | EqualLearn</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../assets/icons/icon-192.png">
  <link rel="stylesheet" href="../assets/css/sidebar-skeuomorphism.css">
  <link rel="stylesheet" href="../assets/css/responsive-layout.css">
  <link rel="stylesheet" href="../assets/css/responsive-auto-fit.css">
  <link rel="stylesheet" href="../assets/css/forced-dark-theme.css?v=1">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; background:#0b1020; color:#eef0fb; font-family:inherit; }
    .admin-content-page { width:100%; max-width:1320px; margin:0 auto; padding:20px 22px 44px; }

    .summary-panel {
      display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
      gap:0; overflow:hidden; margin:0 0 14px; padding:8px 4px;
      background:linear-gradient(145deg,#151f32,#182238);
      border:1px solid #2b3853; border-radius:16px;
      box-shadow:0 10px 28px rgba(0,0,0,.12);
    }
    .stat { min-width:0; padding:10px 18px; border-right:1px solid rgba(154,169,200,.18); }
    .stat:last-child { border-right:0; }
    .stat-label { display:flex; align-items:center; gap:8px; color:#aebbd3; font-size:12px; font-weight:650; }
    .stat-dot { width:7px; height:7px; border-radius:50%; background:#a18bff; box-shadow:0 0 10px rgba(161,139,255,.35); }
    .stat:nth-child(2) .stat-dot { background:#66cda7; box-shadow:0 0 10px rgba(102,205,167,.35); }
    .stat:nth-child(3) .stat-dot { background:#76b8f2; box-shadow:0 0 10px rgba(118,184,242,.35); }
    .stat strong { display:block; margin-top:4px; color:#f5f3ff; font-size:26px; line-height:1.15; font-weight:800; font-variant-numeric:tabular-nums; }

    #message { display:none; padding:10px 13px; margin:0 0 12px; border:1px solid transparent; border-radius:11px; font-size:13px; line-height:1.5; }
    #message.show { display:block; }
    #message.error { color:#ffc1ca; background:rgba(126,39,59,.2); border-color:rgba(225,91,117,.27); }
    #message.success { color:#a8efd0; background:rgba(32,112,82,.2); border-color:rgba(87,197,149,.24); }

    .toolbar { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:0 0 12px; padding:4px; background:#121c2e; border:1px solid #293752; border-radius:13px; width:max-content; max-width:100%; }
    .tab { appearance:none; border:1px solid transparent; border-radius:9px; padding:8px 14px; color:#aebbd3; background:transparent; font:inherit; font-size:12px; font-weight:750; cursor:pointer; transition:background .18s ease,color .18s ease,border-color .18s ease; }
    .tab:hover { color:#fff; background:rgba(255,255,255,.05); }
    .tab.active { color:#fff; background:#6754c8; border-color:#8572e8; box-shadow:0 4px 12px rgba(103,84,200,.22); }

    #contentList { display:grid; gap:8px; min-width:0; }
    .content-card { min-width:0; overflow:hidden; background:#151f32; border:1px solid #2a3852; border-radius:13px; transition:border-color .18s ease,background .18s ease; }
    .content-card:hover { border-color:#475780; }
    .content-card.is-open { border-color:#7564d5; background:#172238; }
    .content-summary-toggle { display:grid; grid-template-columns:38px minmax(0,1fr) auto 20px; align-items:center; gap:11px; width:100%; padding:12px 14px; border:0; background:transparent; color:inherit; text-align:left; cursor:pointer; }
    .content-summary-toggle:hover { background:rgba(255,255,255,.025); }
    .content-kind-icon { display:grid; place-items:center; width:36px; height:36px; border:1px solid rgba(161,139,255,.22); border-radius:11px; color:#b8aaff; background:rgba(117,92,240,.13); }
    .content-kind-icon svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .content-summary-copy { display:grid; gap:5px; min-width:0; }
    .content-title { display:block; min-width:0; overflow:hidden; color:#f0f2fb; font-size:14px; font-weight:760; line-height:1.35; text-overflow:ellipsis; white-space:nowrap; }
    .content-summary-meta { display:flex; align-items:center; flex-wrap:wrap; gap:6px; min-width:0; }
    .type-label { color:#a997ff; font-size:10px; font-weight:800; letter-spacing:.45px; text-transform:uppercase; }
    .status { display:inline-flex; align-items:center; padding:3px 8px; border-radius:99px; color:#f4ce87; background:rgba(169,117,35,.16); border:1px solid rgba(222,170,85,.18); font-size:10px; font-weight:750; white-space:nowrap; }
    .status.approved { color:#9ce2c0; background:rgba(42,136,95,.16); border-color:rgba(87,197,149,.18); }
    .status.published { color:#a8c9ff; background:rgba(67,111,190,.17); border-color:rgba(112,160,232,.18); }
    .status.rejected { color:#ffadb8; background:rgba(153,54,75,.16); border-color:rgba(231,104,126,.18); }
    .content-byline { overflow:hidden; color:#7f8da8; font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
    .content-open-label { color:#9a8bea; font-size:11px; font-weight:700; white-space:nowrap; }
    .content-chevron { display:grid; place-items:center; width:20px; height:20px; color:#8f9cb4; transition:transform .18s ease; }
    .content-chevron svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .content-card.is-open .content-chevron { transform:rotate(180deg); }
    .content-details { padding:0 16px 15px 63px; border-top:1px solid rgba(154,169,200,.13); }
    .content-details[hidden] { display:none !important; }
    .description { margin:12px 0; color:#bcc7dc; font-size:13px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
    .meta { display:flex; flex-wrap:wrap; gap:7px 15px; margin:10px 0; color:#8795ae; font-size:11px; }
    .preview { padding-top:11px; margin-top:10px; border-top:1px solid rgba(154,169,200,.13); }
    .preview h3 { margin:0 0 6px; color:#d9def0; font-size:12px; }
    .preview .body-heading { margin-top:12px; }
    .preview-content { max-height:200px; overflow:auto; color:#aebbd3; font-size:12px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
    .resources { display:grid; gap:6px; margin-top:10px; }
    .resources a { display:block; padding:8px 10px; border:1px solid #2d3b57; border-radius:9px; color:#b8aaff; background:#111b2d; text-decoration:none; font-size:12px; overflow-wrap:anywhere; }
    .resources a:hover { border-color:#7969d6; background:#19243a; }
    .assignment { margin-top:12px; padding:12px; border:1px solid #2b3b59; border-radius:11px; background:#111b2d; }
    .assignment label { display:block; margin-bottom:7px; color:#dce2f2; font-size:12px; font-weight:700; }
    .assignment select { width:min(100%,420px); min-height:38px; padding:8px 10px; border:1px solid #354766; border-radius:9px; color:#edf1fb; background:#17243a; font:inherit; font-size:12px; }
    .review-hint { margin:0 0 9px; color:#a9b6cd; font-size:12px; line-height:1.5; }
    .actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
    .btn { border:1px solid transparent; border-radius:8px; padding:8px 12px; font:inherit; font-size:11px; font-weight:750; cursor:pointer; transition:filter .15s ease,transform .15s ease; }
    .btn:hover:not(:disabled) { filter:brightness(1.08); transform:translateY(-1px); }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .approve { color:#9de5c3; background:rgba(38,136,94,.19); border-color:rgba(91,197,151,.24); }
    .reject { color:#ffb1bd; background:rgba(158,52,75,.2); border-color:rgba(231,104,126,.22); }
    .publish { color:#fff; background:#6653c8; border-color:#8572e8; }
    .published-info { margin-top:11px; padding:10px 12px; border-radius:9px; color:#a9c6ee; background:rgba(62,103,163,.13); border:1px solid rgba(112,160,232,.17); font-size:12px; line-height:1.5; }
    .rejected-info { color:#ffb4bf; background:rgba(153,54,75,.13); border-color:rgba(231,104,126,.17); }
    .empty { padding:27px 16px; border:1px dashed #34435e; border-radius:13px; color:#9ba9c1; background:#121c2e; text-align:center; font-size:13px; line-height:1.6; }
    .empty strong { display:block; margin-bottom:4px; color:#edf0fa; }

    @media (max-width:700px) {
      .admin-content-page { padding:14px 12px 32px; }
      .summary-panel { grid-template-columns:1fr; padding:0; }
      .stat { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 13px; border-right:0; border-bottom:1px solid rgba(154,169,200,.15); }
      .stat:last-child { border-bottom:0; }
      .stat strong { margin:0; font-size:22px; }
      .content-summary-toggle { grid-template-columns:34px minmax(0,1fr) 18px; gap:9px; padding:10px; }
      .content-open-label { display:none; }
      .content-details { padding:0 11px 12px; }
    }
    @media (prefers-reduced-motion:reduce) {
      .content-card,.content-chevron,.tab,.btn { transition:none !important; }
    }
  </style>
</head>
<body>
  <main class="admin-content-page">
    <section class="summary-panel" aria-label="Admin content summary">
      <article class="stat">
        <span class="stat-label"><i class="stat-dot" aria-hidden="true"></i>Pending review</span>
        <strong id="pendingCount">—</strong>
      </article>
      <article class="stat">
        <span class="stat-label"><i class="stat-dot" aria-hidden="true"></i>Approved, not assigned</span>
        <strong id="approvedCount">—</strong>
      </article>
      <article class="stat">
        <span class="stat-label"><i class="stat-dot" aria-hidden="true"></i>Assigned to you</span>
        <strong id="assignedCount">—</strong>
      </article>
    </section>

    <div id="message" role="status" aria-live="polite"></div>

    <nav class="toolbar" aria-label="Content filters">
      <button type="button" class="tab active" data-filter="all" aria-pressed="true">All content</button>
      <button type="button" class="tab" data-filter="module" aria-pressed="false">Modules</button>
      <button type="button" class="tab" data-filter="lesson" aria-pressed="false">Lessons</button>
    </nav>

    <section id="contentList" aria-live="polite">
      <div class="empty">Loading Admin content...</div>
    </section>
  </main>

  <script type="module" src="../assets/js/teacher-admin-content.js"></script>
  <script type="module" src="../assets/js/ui-shell.js"></script>
  <script type="module" src="../assets/js/pwa.js"></script>
  <script type="module" src="../assets/js/theme.js"></script>

  
</body>
</html>
