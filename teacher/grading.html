
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#635bff">
  <title>Activity Grading | EqualLearn</title>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/equallearn.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5fc;
      color: #25243a;
      font-family: Arial, sans-serif;
    }

    .grading-page {
      max-width: 1200px;
      margin: auto;
      padding: 30px 22px 60px;
    }

    .grading-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }

    .grading-header h1 { margin: 5px 0; }
    .muted { color: #77778c; }

    .back-link {
      text-decoration: none;
      color: #635bff;
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 24px;
    }

    .stat, .panel {
      background: white;
      border: 1px solid #e9e8f3;
      border-radius: 17px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(30, 30, 70, .04);
    }

    .stat span {
      display: block;
      color: #77778c;
      font-size: 13px;
    }

    .stat strong {
      display: block;
      font-size: 27px;
      margin-top: 8px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input, select, textarea {
      font: inherit;
      border: 1px solid #deddec;
      border-radius: 10px;
      padding: 12px;
      background: white;
      color: #25243a;
      width: 100%;
    }

    .toolbar input { flex: 1; min-width: 200px; }
    .toolbar select { width: auto; min-width: 170px; }

    .submission {
      background: white;
      border: 1px solid #e9e8f3;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .submission h3 { margin: 0 0 7px; }

    .submission-meta {
      color: #77778c;
      font-size: 13px;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      border-radius: 30px;
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 800;
      background: #fff1c7;
      color: #946000;
    }

    .status.graded {
      background: #dcfce7;
      color: #167442;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #635bff;
      color: white;
    }

    .secondary {
      background: #efeff8;
      color: #45445a;
    }

    .danger {
      background: #fff0f0;
      color: #b42318;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .empty, .error, .loading {
      text-align: center;
      padding: 35px 15px;
      color: #77778c;
    }

    .grading-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(15, 15, 35, .65);
      display: none;
      overflow-y: auto;
      padding: 20px;
    }

    .grading-modal.open {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .modal-card {
      width: 100%;
      max-width: 850px;
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin: auto;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 20px;
    }

    .question-card {
      border: 1px solid #e9e8f3;
      border-radius: 13px;
      padding: 17px;
      margin: 13px 0;
    }

    .question-card h4 { margin: 0 0 12px; }

    .answer-box {
      background: #f7f7fc;
      padding: 13px;
      border-radius: 9px;
      margin: 10px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .question-meta {
      font-size: 12px;
      color: #77778c;
      margin-bottom: 10px;
    }

    .score-input {
      max-width: 150px;
      margin-top: 8px;
    }

    .feedback-area { margin-top: 20px; }

    .feedback-area label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .feedback-area textarea {
      min-height: 100px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    #notice {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    #notice.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    #notice.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    @media(max-width: 650px) {
      .stats { grid-template-columns: 1fr; }
      .grading-page { padding: 20px 14px 40px; }
      .modal-card { padding: 18px; }
    }
  </style>
</head>

<body>
  <main class="grading-page">

    <header class="grading-header">
      <div>
        <p class="muted">EQUALLEARN · TEACHER WORKSPACE</p>
        <h1>Activity Grading</h1>
        <p class="muted">Review student submissions and assign grades.</p>
      </div>

      <a class="back-link" href="dashboard.html">
        ← Back to Dashboard
      </a>
    </header>

    <section class="stats">
      <div class="stat">
        <span>Total Submissions</span>
        <strong id="totalSubmissions">0</strong>
      </div>

      <div class="stat">
        <span>Pending Grading</span>
        <strong id="pendingSubmissions">0</strong>
      </div>

      <div class="stat">
        <span>Graded</span>
        <strong id="gradedSubmissions">0</strong>
      </div>
    </section>

    <section class="panel">
      <div id="notice"></div>

      <div class="toolbar">
        <input
          id="searchSubmission"
          type="search"
          placeholder="Search student or quiz..."
        >

        <select id="statusFilter">
          <option value="all">All submissions</option>
          <option value="pending">Pending grading</option>
          <option value="graded">Graded</option>
        </select>
      </div>

      <div id="submissionList">
        <div class="loading">Loading submissions...</div>
      </div>
    </section>

  </main>

  <div class="grading-modal" id="gradingModal">
    <section class="modal-card">

      <div class="modal-top">
        <div>
          <p class="muted">STUDENT SUBMISSION</p>
          <h2 id="modalStudent">Student</h2>
          <p class="muted" id="modalQuiz"></p>
        </div>

        <button class="secondary" id="closeModal" type="button">
          Close
        </button>
      </div>

      <div id="questionReview"></div>

      <div class="feedback-area">
        <label for="teacherFeedback">Teacher Feedback</label>
        <textarea
          id="teacherFeedback"
          placeholder="Write feedback for this student..."
        ></textarea>
      </div>

      <div class="modal-actions">
        <button class="secondary" id="cancelGrade" type="button">
          Cancel
        </button>

        <button class="primary" id="saveGrade" type="button">
          Save Final Grade
        </button>
      </div>

    </section>
  </div>

  <script type="module" src="../assets/js/teacher-grading.js"></script>
  <script type="module" src="../assets/js/pwa.js"></script>
</body>
</html>
