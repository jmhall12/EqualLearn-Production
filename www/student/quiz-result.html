<!DOCTYPE html>
<html lang="en">
<head>
  <script id="EQUALLEARN_FORCE_DARK_BOOTSTRAP">document.documentElement.dataset.theme="dark";document.documentElement.style.colorScheme="dark";</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Quiz Result | EqualLearn</title>

  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/equallearn.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f3ff;
    }

    .result-shell {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: clamp(20px, 4vw, 44px) clamp(16px, 3vw, 28px) 60px;
    }

    #resultCard {
      padding: clamp(20px, 4vw, 32px);
      background: white;
      border: 1px solid #e6e3f7;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(60, 55, 120, .07);
    }

    #resultCard h2 {
      margin: 6px 0 10px;
      color: #3b3563;
      font-size: clamp(21px, 3vw, 27px);
    }

    #resultCard p { margin: 0 0 12px; color: #6a6585; line-height: 1.7; }

    .result-score { display: flex; align-items: baseline; gap: 12px; }
    .result-score strong { font-size: 34px; color: #5b4fd0; }
    .result-score span { color: #6a6585; font-size: 13px; }

    .result-note {
      padding: 13px 15px;
      border-radius: 12px;
      background: #f2f0ff;
      font-size: 13px;
    }

    .result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

    @media (max-width: 600px) {
      .result-actions .btn { width: 100%; }
    }
  </style>
    <link rel="stylesheet" href="../assets/css/responsive-layout.css">
    <link rel="stylesheet" href="../assets/css/responsive-auto-fit.css">
  <link rel="stylesheet" href="../assets/css/forced-dark-theme.css?v=1">
</head>
<body>
  <main class="result-shell">
    <section id="resultCard">
      <span class="mini-label">ASSESSMENT</span>
      <h2>Loading result…</h2>
      <p>Retrieving your submission.</p>
    </section>
  </main>

  <script type="module" src="../assets/js/quiz-result.js"></script>
  <script type="module" src="../assets/js/pwa.js"></script>
  <script type="module" src="../assets/js/theme.js"></script>
<script type="module" src="../assets/js/evaluation-readonly.js"></script>
</body>
</html>
