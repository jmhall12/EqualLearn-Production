<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="application-name" content="EqualLearn">
  <title>EqualLearn</title>
  <style>
    :root { color-scheme: dark; background: #0b1020; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b1020;
    }
    #equallearn-page-frame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #0b1020;
      z-index: 1;
    }
    #equallearn-lumi-frame {
      position: fixed;
      right: 8px;
      bottom: 8px;
      width: 145px;
      height: 184px;
      display: block;
      border: 0;
      margin: 0;
      padding: 0;
      outline: 0;
      background: transparent;
      background-color: transparent;
      z-index: 2147483647;
      overflow: visible;
      pointer-events: auto;
    }
    #equallearn-app-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #a9b4cf;
      background: #0b1020;
      z-index: 0;
      font: 600 12px system-ui, sans-serif;
      letter-spacing: .03em;
    }
    @media (min-width: 601px) {
      #equallearn-lumi-frame {
        right: 16px;
        bottom: 16px;
        width: 176px;
        height: 224px;
      }
    }
  </style>
</head>
<body>
  <div id="equallearn-app-loading" aria-live="polite">Opening EqualLearn…</div>

  <iframe
    id="equallearn-page-frame"
    name="equallearn-app-page"
    title="EqualLearn application"
    allow="camera; microphone; display-capture; autoplay; fullscreen; clipboard-read; clipboard-write"
    allowfullscreen
    referrerpolicy="same-origin">
  </iframe>

  <!-- One persistent Lumi instance for the entire app session. -->
  <iframe
    src="assets/widgets/lumi.html"
    title="Lumi — EqualLearn Companion"
    id="equallearn-lumi-frame"
    allow="autoplay; microphone"
    allowtransparency="true"
    frameborder="0"
    scrolling="no"
    loading="eager"
    referrerpolicy="same-origin">
  </iframe>

  <script>
    (() => {
      "use strict";

      const pageFrame = document.getElementById("equallearn-page-frame");
      const lumiFrame = document.getElementById("equallearn-lumi-frame");
      const loading = document.getElementById("equallearn-app-loading");
      const params = new URLSearchParams(window.location.search);

      const requestedPath = params.get("path") || "/login.html";

      function resolveSafeAppPath(value) {
        try {
          const target = new URL(value, window.location.origin);

          // Never allow the content frame to escape this origin or recursively
          // open another persistent host.
          if (target.origin !== window.location.origin) {
            return "/login.html";
          }

          if (target.pathname.replace(/\/+$/, "").toLowerCase() === "/app.html") {
            return "/login.html";
          }

          if (!target.pathname.startsWith("/")) {
            return "/login.html";
          }

          return `${target.pathname}${target.search}${target.hash}`;
        } catch (_) {
          return "/login.html";
        }
      }

      function publishRouteContext() {
        try {
          const childLocation = pageFrame.contentWindow.location;
          const route = `${childLocation.pathname}${childLocation.search}${childLocation.hash}`;
          const childTitle = pageFrame.contentDocument?.title || "EqualLearn";
          lumiFrame?.contentWindow?.postMessage({
            type: "EQUALLEARN_PAGE_CONTEXT",
            path: childLocation.pathname + childLocation.search + childLocation.hash,
            title: childTitle
          }, window.location.origin);
        } catch (_) {
          // The host and Lumi must remain stable if the page is temporarily unavailable.
        }
      }

      function syncCurrentRouteToAddressBar() {
        try {
          const childLocation = pageFrame.contentWindow.location;
          const route = `${childLocation.pathname}${childLocation.search}${childLocation.hash}`;
          const next = new URL(window.location.href);

          if (next.searchParams.get("path") !== route) {
            next.searchParams.set("path", route);
            window.history.replaceState(window.history.state, "", next);
          }

          const childTitle = pageFrame.contentDocument?.title;
          if (childTitle) document.title = `${childTitle} | EqualLearn`;
          publishRouteContext();
        } catch (_) {
          // Keep the host stable even if a child route briefly navigates externally.
        }
      }

      pageFrame.addEventListener("load", () => {
        loading.style.display = "none";

        try {
          // Safety cleanup for legacy pages that still contain a page-local
          // Lumi iframe. The parent-level instance remains untouched.
          pageFrame.contentDocument
            ?.getElementById("equallearn-lumi-frame")
            ?.remove();
        } catch (_) {}

        syncCurrentRouteToAddressBar();
      });

      // Evaluation workspace navigation is SPA-based. Keep the browser address
      // bar synced without reloading app.html or the persistent Lumi frame.
      window.addEventListener("message", event => {
        if (event.origin !== window.location.origin || event.source !== pageFrame.contentWindow) return;
        if (event.data?.type === "EQUALLEARN_EVALUATION_CONTEXT") {
          syncCurrentRouteToAddressBar();
        }
      });

      pageFrame.src = resolveSafeAppPath(requestedPath);

      window.addEventListener("resize", () => {
        const mobile = window.matchMedia("(max-width: 600px)").matches;
        const frame = document.getElementById("equallearn-lumi-frame");
        if (!frame || frame.dataset.lumiSelfManaged === "true") return;

        if (mobile) {
          frame.style.right = "8px";
          frame.style.bottom = "8px";
          frame.style.width = "145px";
          frame.style.height = "184px";
        } else {
          frame.style.right = "16px";
          frame.style.bottom = "16px";
          frame.style.width = "176px";
          frame.style.height = "224px";
        }
      }, { passive: true });
    })();
  </script>
  <script type="module" src="assets/js/evaluation-runtime.js"></script>
</body>
</html>
