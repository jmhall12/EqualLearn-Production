
<!DOCTYPE html>
<html lang="en">
<head>
  <script id="EQUALLEARN_FORCE_DARK_BOOTSTRAP">document.documentElement.dataset.theme="dark";document.documentElement.style.colorScheme="dark";</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Learning Modules | EqualLearn</title>

  <link rel="icon" type="image/png" href="../assets/icons/equallearn-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --ml-bg: #171827;
      --ml-panel: #202236;
      --ml-panel-2: #25283e;
      --ml-border: rgba(255,255,255,.085);
      --ml-text: #f5f5ff;
      --ml-muted: #a1a5bf;
      --ml-soft: #777d9d;
      --ml-purple: #8068ff;
      --ml-purple-light: #a99aff;
      --ml-green: #5bd6ad;
      --ml-radius: 20px;
      --ml-shadow: 0 16px 40px rgba(0,0,0,.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
    }

    body {
      background: var(--ml-bg) !important;
      color: var(--ml-text);
      font-family: "DM Sans", sans-serif;
    }

    /* Page content only. The global UI shell owns the sidebar. */
    .modules-page {
      width: 100%;
      min-width: 0;
      min-height: 100vh;
      color: var(--ml-text);
      background:
        radial-gradient(ellipse at 80% 0%, rgba(112,91,240,.13), transparent 36%),
        radial-gradient(ellipse at 0% 55%, rgba(61,100,190,.07), transparent 34%),
        var(--ml-bg);
      font-family: "DM Sans", sans-serif;
    }

    .modules-content {
      width: 100%;
      max-width: 1550px;
      margin: 0 auto;
      padding: 30px clamp(18px, 3vw, 42px) 36px;
    }

    .premium-breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 23px;
      color: var(--ml-muted);
      font-size: 11px;
      font-weight: 600;
    }

    .breadcrumb-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #777d9d;
    }

    .premium-breadcrumb .current {
      color: #fff;
      font-weight: 800;
    }

    /* HERO */

    .premium-hero {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      min-height: 255px;
      padding: 39px 44px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 26px;
      background:
        radial-gradient(ellipse at 85% 10%, rgba(192,177,255,.3), transparent 35%),
        radial-gradient(ellipse at 5% 100%, rgba(75,108,255,.27), transparent 42%),
        linear-gradient(115deg,#28204f 0%,#5140a8 55%,#745de9 100%);
      box-shadow: 0 20px 55px rgba(74,59,174,.2);
      animation: mlRise .6s ease both;
    }

    .premium-hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 380px;
      height: 380px;
      top: -230px;
      right: 7%;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 50%;
      box-shadow:
        0 0 0 35px rgba(255,255,255,.025),
        0 0 0 75px rgba(255,255,255,.025);
    }

    .premium-hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 240px;
      height: 240px;
      right: 25%;
      bottom: -200px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
    }

    .hero-content {
      max-width: 650px;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin-bottom: 17px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 30px;
      background: rgba(255,255,255,.12);
      color: rgba(255,255,255,.92);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.4px;
      backdrop-filter: blur(10px);
    }

    .hero-eyebrow span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8ef0d1;
      box-shadow: 0 0 12px #8ef0d1;
    }

    .premium-hero h1 {
      margin: 0 0 13px;
      color: #fff !important;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: clamp(29px, 3.2vw, 43px);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -1.7px;
    }

    .premium-hero h1 em {
      color: #c9bdff;
      font-style: normal;
    }

    .premium-hero p {
      max-width: 500px;
      margin: 0;
      color: rgba(255,255,255,.78) !important;
      font-size: 12px;
      line-height: 1.9;
    }

    .hero-visual {
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 155px;
      width: 155px;
      height: 155px;
      margin-right: 20px;
      border: 1px solid rgba(255,255,255,.23);
      border-radius: 34px;
      background: linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.045));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 20px 45px rgba(22,16,77,.2);
      transform: rotate(7deg);
      backdrop-filter: blur(12px);
      animation: mlFloat 5s ease-in-out infinite;
    }

    .hero-visual-icon {
      font-size: 68px;
      filter: drop-shadow(0 12px 15px rgba(0,0,0,.22));
      transform: rotate(-7deg);
    }

    .hero-visual-badge {
      position: absolute;
      right: -22px;
      bottom: 14px;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 11px;
      background: rgba(24,23,67,.8);
      color: #fff;
      font-size: 8px;
      font-weight: 800;
      white-space: nowrap;
      transform: rotate(-7deg);
    }

    /* STATISTICS */

    .premium-stats {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 15px;
      margin: 22px 0 37px;
    }

    .premium-stat {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
      padding: 19px 20px;
      border: 1px solid var(--ml-border);
      border-radius: 18px;
      background: linear-gradient(145deg,rgba(39,42,63,.98),rgba(31,34,52,.98));
      box-shadow: var(--ml-shadow);
      transition: transform .25s,border-color .25s;
    }

    .premium-stat:hover {
      transform: translateY(-4px);
      border-color: rgba(154,137,255,.4);
    }

    .stat-icon {
      display: grid;
      place-items: center;
      flex: 0 0 47px;
      width: 47px;
      height: 47px;
      border-radius: 15px;
      background: rgba(128,104,255,.16);
      font-size: 21px;
    }

    .premium-stat:nth-child(2) .stat-icon {
      background: rgba(64,202,151,.13);
    }

    .premium-stat:nth-child(3) .stat-icon {
      background: rgba(255,172,104,.13);
    }

    .stat-info { min-width: 0; }

    .stat-info span {
      display: block;
      margin-bottom: 5px;
      color: var(--ml-muted);
      font-size: 10px;
      font-weight: 600;
    }

    .stat-info strong {
      display: block;
      color: #fff;
      font-family: "Plus Jakarta Sans",sans-serif;
      font-size: 23px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    #sectionStat { font-size: 15px; }

    /* SECTION HEADING */

    .modules-section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .section-heading-icon {
      display: grid;
      place-items: center;
      flex: 0 0 43px;
      width: 43px;
      height: 43px;
      border: 1px solid rgba(128,104,255,.2);
      border-radius: 14px;
      background: rgba(128,104,255,.15);
      color: #b4a6ff;
      font-size: 20px;
    }

    .modules-section-heading h2 {
      margin: 0;
      color: #f5f5ff !important;
      font-family: "Plus Jakarta Sans",sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .modules-section-heading p {
      margin: 5px 0 0;
      color: var(--ml-muted) !important;
      font-size: 11px;
    }

    .section-label {
      padding: 8px 12px;
      border: 1px solid rgba(128,104,255,.22);
      border-radius: 30px;
      background: rgba(128,104,255,.12);
      color: #c1b6ff;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    /* TOOLBAR */

    .modules-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 21px;
    }

    .modules-search {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .modules-search span {
      position: absolute;
      top: 50%;
      left: 15px;
      color: #9298b5;
      font-size: 20px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .modules-search input {
      width: 100%;
      height: 49px;
      padding: 0 15px 0 44px;
      border: 1px solid var(--ml-border);
      border-radius: 13px;
      outline: none;
      background: #202236 !important;
      color: #f5f5ff !important;
      font-family: inherit;
      font-size: 11px;
      transition: .2s;
    }

    .modules-search input::placeholder {
      color: #9298b0;
    }

    .modules-search input:focus {
      border-color: rgba(144,123,255,.8);
      box-shadow: 0 0 0 4px rgba(128,104,255,.1);
    }

    .modules-filter {
      height: 49px;
      padding: 0 17px;
      border: 1px solid var(--ml-border);
      border-radius: 13px;
      background: #25283d !important;
      color: #c4c7d9 !important;
      font-family: inherit;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: .2s;
    }

    .modules-filter:hover {
      border-color: rgba(144,123,255,.5);
      color: #fff !important;
    }

    .modules-filter.active {
      border-color: var(--ml-purple);
      background: linear-gradient(135deg,#745cf0,#8b70ff) !important;
      color: #fff !important;
      box-shadow: 0 7px 18px rgba(112,92,240,.25);
    }

    /* MODULE GRID */

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 18px;
      min-width: 0;
    }

    .module-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--ml-border);
      border-radius: 19px;
      background: linear-gradient(150deg,#25283d,#202236);
      box-shadow: 0 8px 24px rgba(0,0,0,.13);
      animation: mlRise .45s ease both;
      transition: transform .25s,border-color .25s,box-shadow .25s;
    }

    .module-card:hover {
      transform: translateY(-5px);
      border-color: rgba(153,135,255,.42);
      box-shadow: 0 18px 35px rgba(0,0,0,.23);
    }

    .module-cover {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 143px;
      padding: 20px;
      overflow: hidden;
      background: linear-gradient(130deg,#4939b8,#9585ff);
    }

    .module-card:nth-child(4n+2) .module-cover {
      background: linear-gradient(130deg,#117b77,#45b99f);
    }

    .module-card:nth-child(4n+3) .module-cover {
      background: linear-gradient(130deg,#9b514b,#df8c70);
    }

    .module-card:nth-child(4n+4) .module-cover {
      background: linear-gradient(130deg,#285c9d,#6595dc);
    }

    .module-cover::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      right: -70px;
      bottom: -130px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 50%;
      box-shadow: 0 0 0 25px rgba(255,255,255,.045),0 0 0 55px rgba(255,255,255,.035);
    }

    .cover-label {
      position: relative;
      z-index: 1;
      max-width: 68%;
      color: rgba(255,255,255,.94);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .cover-icon {
      position: relative;
      z-index: 1;
      font-size: 52px;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.18));
      transition: transform .3s;
    }

    .module-card:hover .cover-icon {
      transform: scale(1.1) rotate(-5deg);
    }

    .cover-circle { display: none; }

    .module-body { padding: 19px; }

    .module-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .category {
      display: inline-block;
      max-width: 70%;
      padding: 6px 10px;
      overflow: hidden;
      border-radius: 30px;
      background: rgba(128,104,255,.15);
      color: #bcb0ff;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .6px;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .published {
      color: #6ce0b5;
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
    }

    .module-body h3 {
      margin: 0 0 9px;
      color: #f5f5ff !important;
      font-family: "Plus Jakarta Sans",sans-serif;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .module-description {
      display: -webkit-box;
      min-height: 39px;
      margin: 0;
      overflow: hidden;
      color: #a6abc2 !important;
      font-size: 10px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .resource-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 13px;
    }

    .resource-tag {
      max-width: 100%;
      padding: 6px 9px;
      overflow: hidden;
      border: 1px solid rgba(128,104,255,.15);
      border-radius: 8px;
      background: rgba(128,104,255,.08);
      color: #c0b6ff;
      font-size: 8px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .module-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 17px;
      padding-top: 13px;
      border-top: 1px solid rgba(255,255,255,.075);
    }

    .teacher-name {
      min-width: 0;
      overflow: hidden;
      color: #9da3bd;
      font-size: 9px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .open-btn {
      flex-shrink: 0;
      padding: 10px 13px;
      border: 1px solid rgba(128,104,255,.2);
      border-radius: 10px;
      background: rgba(128,104,255,.16);
      color: #c6bcff;
      font-family: inherit;
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .open-btn:hover {
      border-color: var(--ml-purple);
      background: var(--ml-purple);
      color: white;
      box-shadow: 0 6px 15px rgba(112,92,240,.22);
    }

    /* LOADING */

    .skeleton {
      min-height: 310px;
      overflow: hidden;
      border: 1px solid var(--ml-border);
      border-radius: 19px;
      background: linear-gradient(100deg,#25283d 25%,#30334c 50%,#25283d 75%);
      background-size: 200% 100%;
      animation: mlShimmer 1.5s infinite;
    }

    /* EMPTY / ERROR */

    .state-box {
      grid-column: 1 / -1;
      padding: 58px 22px;
      border: 1px dashed rgba(255,255,255,.15);
      border-radius: 20px;
      background: rgba(36,39,59,.7);
      text-align: center;
    }

    .state-icon {
      margin-bottom: 13px;
      font-size: 40px;
    }

    .state-box h3 {
      margin: 0 0 8px;
      color: #f4f3ff !important;
      font-family: "Plus Jakarta Sans",sans-serif;
      font-size: 16px;
      font-weight: 800;
    }

    .state-box p {
      max-width: 450px;
      margin: 0 auto;
      color: #a4aac2 !important;
      font-size: 11px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .retry-btn {
      margin-top: 18px;
      padding: 11px 17px;
      border: 0;
      border-radius: 10px;
      background: var(--ml-purple);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    /* MODAL */

    .modules-modal {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(8,10,24,.76);
      backdrop-filter: blur(9px);
    }

    .modules-modal.show { display: flex; }

    .modules-modal-card {
      width: 100%;
      max-width: 590px;
      max-height: 86vh;
      overflow-y: auto;
      padding: 26px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      background: #25283d;
      box-shadow: 0 30px 90px rgba(0,0,0,.4);
      animation: mlRise .3s ease;
    }

    .modules-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 19px;
    }

    .modules-modal-head h3 {
      margin: 0;
      color: #fff !important;
      font-family: "Plus Jakarta Sans",sans-serif;
      font-size: 19px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .modules-modal-close {
      display: grid;
      place-items: center;
      flex: 0 0 37px;
      width: 37px;
      height: 37px;
      border: 1px solid var(--ml-border);
      border-radius: 11px;
      background: #30334b;
      color: #fff;
      font-size: 21px;
      cursor: pointer;
    }

    .modules-modal-description {
      color: #b7bbd0 !important;
      font-size: 11px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .modules-modal-resources {
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }

    .modules-modal-resources a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
      background: #30334b;
      color: #c6bcff !important;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: .2s;
    }

    .modules-modal-resources a:hover {
      border-color: rgba(144,123,255,.55);
      background: #39365d;
      transform: translateX(3px);
    }

    .no-resources {
      color: var(--ml-muted);
      font-size: 11px;
    }

    /* FOOTER */

    .modules-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 45px;
      padding: 20px 0 5px;
      border-top: 1px solid var(--ml-border);
      color: #858ba6;
      font-size: 9px;
      font-weight: 600;
    }

    /* ANIMATIONS */

    @keyframes mlRise {
      from { opacity: 0; transform: translateY(13px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes mlFloat {
      0%,100% { transform: rotate(7deg) translateY(0); }
      50% { transform: rotate(7deg) translateY(-9px); }
    }

    @keyframes mlShimmer {
      to { background-position: -200% 0; }
    }

    /* RESPONSIVE */

    @media(max-width:1100px) {
      .modules-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .hero-visual { width: 130px; height: 130px; flex-basis: 130px; }
      .hero-visual-icon { font-size: 57px; }
    }

    @media(max-width:760px) {
      .modules-content { padding: 22px 16px 35px; }
      .premium-hero { min-height: 215px; padding: 28px 24px; }
      .premium-hero h1 { font-size: 31px; }
      .hero-visual { width: 100px; height: 100px; flex-basis: 100px; margin-right: 8px; border-radius: 23px; }
      .hero-visual-icon { font-size: 43px; }
      .hero-visual-badge { right: -12px; bottom: 7px; font-size: 7px; }
      .premium-stat { gap: 10px; padding: 14px 11px; }
      .stat-icon { flex-basis: 37px; width: 37px; height: 37px; border-radius: 11px; font-size: 16px; }
      .stat-info strong { font-size: 18px; }
      .modules-toolbar { flex-wrap: wrap; }
      .modules-search { flex-basis: 100%; }
      .modules-filter { flex: 1; }
    }

    @media(max-width:560px) {
      .modules-grid { grid-template-columns: 1fr; }
      .premium-stats { grid-template-columns: 1fr; gap: 10px; }
      .premium-hero { padding: 27px 22px; }
      .hero-visual { display: none; }
      .premium-hero h1 { font-size: 29px; }
      .modules-section-heading h2 { font-size: 17px; }
      .section-label { display: none; }
      .modules-modal { padding: 12px; }
      .modules-modal-card { padding: 21px; }
      .skeleton { min-height: 250px; }
    }

    @media(prefers-reduced-motion:reduce) {
      .modules-page *,
      .modules-modal * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
    <link rel="stylesheet" href="../assets/css/responsive-layout.css">
    <link rel="stylesheet" href="../assets/css/responsive-auto-fit.css">
  <link rel="stylesheet" href="../assets/css/forced-dark-theme.css?v=1">
</head>

  <style>
    :root {
      color-scheme: dark;
      --ml-bg: #0b1020;
      --ml-panel: #141d32;
      --ml-panel-soft: #18243b;
      --ml-row: #17233a;
      --ml-row-hover: #1d2a46;
      --ml-border: rgba(178, 192, 232, .13);
      --ml-border-active: rgba(164, 142, 255, .42);
      --ml-text: #f1f4ff;
      --ml-muted: #a4aec8;
      --ml-muted-2: #7f8ba8;
      --ml-purple: #9278f3;
      --ml-purple-strong: #765fe0;
      --ml-green: #74dfbc;
      --ml-shadow: 0 12px 32px rgba(0,0,0,.18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: clip;
      color-scheme: dark;
      background: var(--ml-bg) !important;
    }

    body {
      color: var(--ml-text) !important;
      font-family: "DM Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .modules-page {
      width: 100%;
      min-width: 0;
      min-height: 100vh;
      padding: 0;
      color: var(--ml-text);
      background:
        radial-gradient(ellipse at 86% 0%, rgba(117, 93, 225, .09), transparent 34%),
        var(--ml-bg);
    }

    .modules-content {
      width: min(100% - 34px, 1240px);
      max-width: 1240px;
      margin: 0 auto;
      padding: 18px 0 32px;
    }

    /* One compact container: the global UI shell already displays the page title. */
    .module-browser-card {
      min-width: 0;
      padding: 19px;
      border: 1px solid var(--ml-border);
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(22,32,54,.98), rgba(16,25,44,.98));
      box-shadow: var(--ml-shadow), inset 0 1px 0 rgba(255,255,255,.035);
    }

    .module-browser-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(178,192,232,.11);
    }

    .browser-context { min-width: 0; }

    .browser-kicker {
      display: block;
      margin-bottom: 5px;
      color: #a996ff;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .browser-description {
      margin: 0;
      color: var(--ml-muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .browser-stats {
      display: flex;
      flex: 0 0 auto;
      align-items: stretch;
      gap: 0;
    }

    .browser-stat {
      min-width: 104px;
      padding: 2px 15px;
      border-left: 1px solid rgba(178,192,232,.13);
    }

    .browser-stat:first-child { border-left: 0; }

    .browser-stat span {
      display: block;
      margin-bottom: 5px;
      color: var(--ml-muted);
      font-size: 9px;
      font-weight: 650;
      white-space: nowrap;
    }

    .browser-stat strong {
      display: block;
      color: #f5f5ff;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    #sectionStat { font-size: 12px; color: #c6baff; }

    .modules-toolbar {
      display: grid;
      grid-template-columns: minmax(200px, 1fr) auto auto;
      gap: 9px;
      align-items: center;
      margin: 14px 0 13px;
    }

    .modules-search {
      position: relative;
      min-width: 0;
    }

    .modules-search svg {
      position: absolute;
      top: 50%;
      left: 13px;
      width: 16px;
      height: 16px;
      color: #929fbd;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .modules-search input {
      display: block;
      width: 100%;
      height: 42px;
      padding: 0 13px 0 39px;
      border: 1px solid rgba(178,192,232,.17);
      border-radius: 11px;
      outline: none;
      background: #101a2e !important;
      color: var(--ml-text) !important;
      font: inherit;
      font-size: 12px;
      transition: border-color .16s ease, box-shadow .16s ease;
    }

    .modules-search input::placeholder { color: #8794b2; }

    .modules-search input:focus {
      border-color: rgba(164,142,255,.7);
      box-shadow: 0 0 0 3px rgba(146,120,243,.10);
    }

    .modules-filter {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(178,192,232,.13);
      border-radius: 11px;
      background: rgba(255,255,255,.045) !important;
      color: #c8d0e5 !important;
      font: inherit;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, color .16s ease;
    }

    .modules-filter:hover {
      border-color: rgba(164,142,255,.36);
      color: #fff !important;
    }

    .modules-filter.active {
      border-color: rgba(164,142,255,.62);
      background: linear-gradient(120deg, #9278f3, #7459dc) !important;
      color: #fff !important;
      box-shadow: 0 6px 16px rgba(112,89,219,.19);
    }

    .modules-list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 2px 8px;
    }

    .modules-list-heading strong {
      color: #e9edff;
      font-size: 11px;
      font-weight: 800;
    }

    .modules-list-heading span {
      color: var(--ml-muted-2);
      font-size: 10px;
      font-weight: 650;
    }

    .modules-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 7px;
      min-width: 0;
    }

    .module-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 13px;
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid rgba(178,192,232,.105);
      border-radius: 13px;
      background: linear-gradient(105deg, rgba(28,42,68,.84), rgba(22,34,56,.9));
      color: inherit !important;
      text-decoration: none !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.018);
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
      animation: rowEnter .28s ease both;
      -webkit-tap-highlight-color: transparent;
    }

    .module-row:hover,
    .module-row:focus-visible {
      border-color: var(--ml-border-active);
      background: linear-gradient(105deg, rgba(37,52,84,.98), rgba(27,42,69,.98));
      transform: translateY(-1px);
    }

    .module-row-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(164,142,255,.20);
      border-radius: 12px;
      background: rgba(130,105,229,.13);
      color: #c5b9ff;
    }

    .module-row-icon svg { width: 20px; height: 20px; }

    .module-row-content { min-width: 0; }

    .module-row-heading {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px 9px;
      min-width: 0;
    }

    .module-row-heading h3 {
      min-width: 0;
      margin: 0;
      color: #f2f4ff !important;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -.015em;
      overflow-wrap: anywhere;
    }

    .module-category {
      display: inline-flex;
      align-items: center;
      max-width: 190px;
      padding: 4px 7px;
      overflow: hidden;
      border: 1px solid rgba(164,142,255,.15);
      border-radius: 7px;
      background: rgba(130,105,229,.10);
      color: #bfb3ff;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .04em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .module-row-description {
      display: -webkit-box;
      margin: 4px 0 6px;
      overflow: hidden;
      color: #aab4cc !important;
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }

    .module-row-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px 13px;
      min-width: 0;
      color: #8f9bb8;
      font-size: 9px;
      font-weight: 600;
    }

    .module-row-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .module-row-meta-item svg {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      color: #a99aff;
    }

    .module-row-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--ml-green);
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
    }

    .module-row-status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ml-green);
      box-shadow: 0 0 9px rgba(116,223,188,.45);
    }

    .module-row-arrow {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid rgba(164,142,255,.15);
      border-radius: 9px;
      background: rgba(130,105,229,.08);
      color: #b9adff;
    }

    .module-row-arrow svg { width: 15px; height: 15px; }

    .skeleton {
      height: 72px;
      border: 1px solid rgba(178,192,232,.08);
      border-radius: 13px;
      background: linear-gradient(100deg, #17233a 25%, #202e4a 50%, #17233a 75%);
      background-size: 200% 100%;
      animation: skeletonSweep 1.45s ease infinite;
    }

    .state-box {
      display: grid;
      justify-items: center;
      padding: 38px 18px;
      border: 1px dashed rgba(178,192,232,.17);
      border-radius: 13px;
      background: rgba(255,255,255,.018);
      text-align: center;
    }

    .state-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      margin-bottom: 10px;
      border: 1px solid rgba(164,142,255,.18);
      border-radius: 13px;
      background: rgba(130,105,229,.10);
      color: #c3b8ff;
    }

    .state-icon svg { width: 20px; height: 20px; }

    .state-box h3 {
      margin: 0 0 5px;
      color: #f1f3ff !important;
      font-size: 13px;
      font-weight: 800;
    }

    .state-box p {
      max-width: 420px;
      margin: 0;
      color: var(--ml-muted) !important;
      font-size: 10px;
      line-height: 1.65;
    }

    .retry-btn {
      min-height: 36px;
      margin-top: 14px;
      padding: 8px 13px;
      border: 0;
      border-radius: 9px;
      background: var(--ml-purple-strong);
      color: #fff;
      font: inherit;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .modules-footer {
      margin: 12px 2px 0;
      color: #697692;
      font-size: 9px;
      text-align: right;
    }

    @keyframes rowEnter {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes skeletonSweep {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    @media (max-width: 760px) {
      .modules-content { width: calc(100% - 24px); padding: 12px 0 24px; }
      .module-browser-card { padding: 14px; border-radius: 16px; }
      .module-browser-top { align-items: flex-start; flex-direction: column; gap: 11px; }
      .browser-stats { width: 100%; }
      .browser-stat { flex: 1; min-width: 0; padding: 1px 9px; }
      .browser-stat:first-child { padding-left: 0; }
      .browser-stat span { font-size: 8px; }
      .browser-stat strong { font-size: 14px; }
      #sectionStat { font-size: 10px; }
      .modules-toolbar { grid-template-columns: minmax(0,1fr) auto auto; gap: 6px; margin: 12px 0; }
      .modules-search input { height: 40px; font-size: 11px; }
      .modules-filter { min-height: 40px; padding: 0 9px; font-size: 9px; }
      .module-row { grid-template-columns: 37px minmax(0,1fr) 25px; gap: 10px; padding: 10px; border-radius: 11px; }
      .module-row-icon { width: 37px; height: 37px; border-radius: 10px; }
      .module-row-icon svg { width: 18px; height: 18px; }
      .module-row-heading h3 { font-size: 12px; }
      .module-row-description { font-size: 10px; }
      .module-row-meta { gap: 4px 9px; font-size: 8px; }
      .module-row-arrow { width: 25px; height: 25px; }
    }

    @media (max-width: 430px) {
      .modules-content { width: calc(100% - 18px); padding-top: 9px; }
      .module-browser-card { padding: 11px; }
      .browser-description { font-size: 10px; }
      .browser-stat { padding-inline: 6px; }
      .browser-stat span { white-space: normal; line-height: 1.35; min-height: 22px; }
      .modules-toolbar { grid-template-columns: minmax(0,1fr) auto; }
      .modules-search { grid-column: 1 / -1; }
      .modules-filter { width: 100%; }
      .modules-list-heading strong { font-size: 10px; }
      .module-row-meta .module-row-status { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="modules-page">
    <main class="modules-content">
      <section class="module-browser-card" aria-label="Published learning materials">
        <div class="module-browser-top">
          <div class="browser-context">
            <span class="browser-kicker">Your classroom</span>
            <p class="browser-description">Browse the learning materials published for your class.</p>
          </div>

          <div class="browser-stats" aria-label="Learning overview">
            <div class="browser-stat">
              <span>Available modules</span>
              <strong id="moduleCount">—</strong>
            </div>
            <div class="browser-stat">
              <span>Your section</span>
              <strong id="sectionStat">—</strong>
            </div>
            <div class="browser-stat">
              <span>Learning resources</span>
              <strong id="resourceCount">—</strong>
            </div>
          </div>
        </div>

        <div class="modules-toolbar">
          <label class="modules-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8"></circle>
              <path d="m16 16 4.3 4.3"></path>
            </svg>
            <input
              id="searchInput"
              type="search"
              placeholder="Search modules, topics, or teachers..."
              autocomplete="off"
              aria-label="Search published modules"
            >
          </label>

          <button type="button" class="modules-filter active" data-filter="all">All Modules</button>
          <button type="button" class="modules-filter" data-filter="recent">Recently Added</button>
        </div>

        <div class="modules-list-heading">
          <strong>Published learning materials</strong>
          <span>Open an item to view its content</span>
        </div>

        <div class="modules-grid" id="moduleGrid" aria-live="polite">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </section>

      <footer class="modules-footer">
        © <span id="year"></span> EqualLearn
      </footer>
    </main>
  </div>

  <!-- Module list behavior and navigation -->
  <script type="module" src="../assets/js/student.modules.js"></script>

  <!-- Global application shell owns the page header and navigation -->
  <script type="module" src="../assets/js/ui-shell.js"></script>
  <script type="module" src="../assets/js/theme.js"></script>
  <script type="module" src="../assets/js/pwa.js"></script>

  <!-- Existing Lumi companion -->
  <iframe
    src="../assets/widgets/lumi.html"
    title="Lumi — EqualLearn Companion"
    id="equallearn-lumi-frame"
    allow="autoplay"
    style="position:fixed;right:8px;bottom:8px;width:210px;height:255px;border:0;background:transparent;z-index:99999;overflow:hidden;pointer-events:auto;">
  </iframe>
</body>
</html>
