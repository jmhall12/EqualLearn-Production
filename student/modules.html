
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#635bff">
<title>EqualLearn | Classwork</title>

<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/equallearn.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icons/icon-192.png">

<style>
body {
  background: #f5f6fc;
  margin: 0;
}
.classroom {
  max-width: 950px;
  margin: auto;
  padding: 25px 20px 110px;
}
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}
.page-header h1 { margin: 0; font-size: 29px; }
.page-header p { color: #777; margin-bottom: 0; }
.banner {
  background: linear-gradient(120deg,#635bff,#8874ff);
  color: white;
  border-radius: 18px;
  padding: 28px;
  margin-bottom: 22px;
}
.banner h2 { margin: 0 0 8px; }
.banner p { margin: 0; opacity: .9; }
.tabs {
  display: flex;
  gap: 22px;
  overflow-x: auto;
  border-bottom: 1px solid #ddd;
  margin-bottom: 22px;
}
.tab {
  border: 0;
  background: transparent;
  padding: 13px 4px;
  color: #777;
  font-weight: 700;
  white-space: nowrap;
}
.tab.active {
  color: #635bff;
  border-bottom: 3px solid #635bff;
}
.section-heading {
  margin: 25px 0 12px;
  font-size: 17px;
}
.content-card {
  background: white;
  border: 1px solid #e8e9f2;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 13px;
  box-shadow: 0 4px 18px rgba(0,0,0,.035);
}
.content-top {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.content-icon {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  background: #efedff;
  border-radius: 12px;
  font-size: 20px;
}
.content-card h3 { margin: 0 0 7px; font-size: 16px; }
.content-card p {
  color: #70758a;
  font-size: 14px;
  line-height: 1.55;
  margin: 0;
  overflow-wrap: anywhere;
}
.content-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 13px;
}
.meta {
  background: #f3f4f8;
  padding: 6px 9px;
  border-radius: 7px;
  color: #666b7e;
  font-size: 11px;
}
.content-action {
  display: inline-block;
  margin-top: 14px;
  color: #635bff;
  font-weight: 700;
  text-decoration: none;
  font-size: 14px;
}
.empty {
  padding: 35px 15px;
  text-align: center;
  background: white;
  color: #777;
  border-radius: 14px;
}
.hidden { display: none !important; }
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(100%,950px);
  height: 68px;
  background: white;
  border: 1px solid #e8e9f2;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}
.bottom-nav a {
  text-decoration: none;
  color: #777;
  font-size: 13px;
  text-align: center;
}
.bottom-nav .active { color: #635bff; }
@media(max-width:600px) {
  .classroom { padding: 20px 14px 100px; }
  .banner { padding: 22px; }
}
</style>
</head>

<body>
<main class="classroom">

  <header class="page-header">
    <div>
      <p>EQUALLEARN STUDENT WORKSPACE</p>
      <h1>Classwork</h1>
    </div>
  </header>

  <section class="banner">
    <h2>Learning Space</h2>
    <p>Announcements, learning materials, assignments and quizzes in one place.</p>
  </section>

  <nav class="tabs">
    <button class="tab active" data-tab="all">All</button>
    <button class="tab" data-tab="announcements">Announcements</button>
    <button class="tab" data-tab="assignments">Assignments</button>
    <button class="tab" data-tab="materials">Materials</button>
    <button class="tab" data-tab="quizzes">Quizzes</button>
  </nav>

  <section id="classContent">
    <div class="empty">Loading your classwork...</div>
  </section>

</main>

<nav class="bottom-nav">
  <a href="dashboard.html">🏠<br>Home</a>
  <a href="modules.html" class="active">📚<br>Classwork</a>
  <a href="progress.html">📈<br>Progress</a>
  <a href="profile.html">👤<br>Profile</a>
</nav>

<script type="module" src="../assets/js/modules.js"></script>
<script type="module" src="../assets/js/ui-shell.js"></script>
<script type="module" src="../assets/js/pwa.js"></script>
<script type="module" src="../assets/js/theme.js"></script>
</body>
</html>
