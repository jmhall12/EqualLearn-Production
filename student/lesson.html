
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#635bff">

    <title>Lesson | EqualLearn</title>

    <!-- EQUALLEARN TYPOGRAPHY -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- GLOBAL STYLESHEETS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/equallearn.css">
    <link rel="stylesheet" href="../assets/css/glass-dashboard.css">
    <link rel="stylesheet" href="../assets/css/sidebar-skeuomorphism.css">

    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" type="image/png" href="../assets/icons/equallearn-logo.png">

    <style>
        /* =================================================
           EQUALLEARN STUDENT LESSON PAGE
           Glassmorphism Design System
        ================================================= */

        :root {
            --lesson-primary: #635bdb;
            --lesson-primary-light: #8178ff;
            --lesson-text: #252945;
            --lesson-muted: #858ba6;
            --lesson-glass: rgba(255,255,255,.66);
            --lesson-border: rgba(255,255,255,.86);
            --lesson-shadow: 0 10px 30px rgba(65,70,130,.07);
        }

        /* =================================================
           GLOBAL LAYOUT
        ================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            min-height: 100%;
            margin: 0;
            overflow-x: hidden;
        }

        body {
            color: var(--lesson-text);
            background:
                radial-gradient(
                    circle at 10% 5%,
                    rgba(99,91,219,.12),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(120,170,255,.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #f4f5ff,
                    #eceeff 55%,
                    #f8f8ff
                );
            font-family: "DM Sans", sans-serif;
        }

        /* Keep content within the application shell */
        .el-app-shell {
            width: 100%;
            min-width: 0;
            max-width: 100%;
        }

        .el-app-main {
            min-width: 0;
            max-width: 100%;
            overflow-x: clip;
        }

        .el-page-content {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: clip;
        }

        /* =================================================
           LESSON PAGE WRAPPER
        ================================================= */

        .phone {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            min-height: calc(100vh - 70px);
            margin: 0;
            padding: clamp(18px, 2.2vw, 32px);
            overflow: hidden;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            animation: lessonPageEnter .55s ease both;
        }

        /* =================================================
           PAGE HEADER
        ================================================= */

        .header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-width: 0;
            margin-bottom: 25px;
            padding: clamp(22px, 3vw, 32px);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 21px;
            color: #fff;
            background:
                radial-gradient(
                    circle at 90% 10%,
                    rgba(255,255,255,.22),
                    transparent 35%
                ),
                linear-gradient(
                    120deg,
                    #5148c9,
                    #8178ff
                );
            box-shadow: 0 12px 28px rgba(99,91,219,.17);
        }

        .header::before {
            content: "";
            position: absolute;
            width: 190px;
            height: 190px;
            right: -70px;
            top: -115px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 50%;
            box-shadow:
                0 0 0 22px rgba(255,255,255,.035),
                0 0 0 45px rgba(255,255,255,.025);
            pointer-events: none;
        }

        .header-content {
            position: relative;
            z-index: 1;
            min-width: 0;
        }

        .header-label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,.76);
            font-size: 10px;
            font-weight: 850;
            letter-spacing: 1.3px;
            text-transform: uppercase;
        }

        .header h1 {
            margin: 0;
            color: #fff;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: clamp(25px, 3vw, 34px);
            font-weight: 850;
            letter-spacing: -.8px;
            overflow-wrap: anywhere;
        }

        .header p {
            max-width: 620px;
            margin: 9px 0 0;
            color: rgba(255,255,255,.82);
            font-size: 13px;
            line-height: 1.7;
        }

        /* =================================================
           LESSON CONTAINER
        ================================================= */

        #lessonContainer {
            display: grid;
            width: 100%;
            min-width: 0;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: stretch;
            gap: 17px;
        }

        /* Loading text should span the entire grid */
        #lessonContainer:empty::after {
            content: "No lesson content available.";
            grid-column: 1 / -1;
            display: block;
            padding: 35px 20px;
            border: 1px solid var(--lesson-border);
            border-radius: 17px;
            color: var(--lesson-muted);
            background: rgba(255,255,255,.55);
            text-align: center;
            font-size: 13px;
        }

        /* =================================================
           LESSON CARDS
        ================================================= */

        .lesson-card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 190px;
            padding: 23px;
            overflow: hidden;
            border: 1px solid var(--lesson-border);
            border-radius: 19px;
            background: var(--lesson-glass);
            box-shadow:
                var(--lesson-shadow),
                inset 0 1px 0 rgba(255,255,255,.8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .25s ease,
                background .25s ease;
            animation: lessonCardEnter .5s ease both;
        }

        .lesson-card::before {
            content: "";
            position: absolute;
            width: 115px;
            height: 115px;
            top: -65px;
            right: -55px;
            border-radius: 50%;
            background: rgba(120,101,220,.055);
            pointer-events: none;
            transition: transform .3s ease;
        }

        .lesson-card:hover {
            transform: translateY(-4px);
            border-color: rgba(120,101,220,.2);
            background: rgba(255,255,255,.78);
            box-shadow: 0 15px 34px rgba(65,70,130,.11);
        }

        .lesson-card:hover::before {
            transform: scale(1.4);
        }

        .lesson-card h3 {
            position: relative;
            z-index: 1;
            margin: 0 0 11px;
            color: var(--lesson-text);
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 17px;
            font-weight: 850;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .lesson-card p {
            position: relative;
            z-index: 1;
            margin: 0 0 17px;
            color: #70778c;
            font-size: 12px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        /* =================================================
           LESSON CARD BUTTONS
        ================================================= */

        .lesson-card .btn {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
            min-height: 45px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            margin-top: auto;
            margin-bottom: 9px;
            border: 1px solid transparent;
            border-radius: 11px;
            color: #fff;
            background: linear-gradient(
                110deg,
                #635bdb,
                #8178ff
            );
            box-shadow: 0 5px 13px rgba(99,91,219,.16);
            font-family: "DM Sans", sans-serif;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition:
                transform .2s ease,
                box-shadow .2s ease,
                filter .2s ease;
        }

        .lesson-card .btn:last-child {
            margin-bottom: 0;
        }

        .lesson-card .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
            box-shadow: 0 8px 17px rgba(99,91,219,.23);
        }

        .lesson-card .btn:active {
            transform: translateY(0) scale(.99);
        }

        .lesson-card .btn.secondary {
            color: #087b65;
            border-color: rgba(0,184,148,.12);
            background: rgba(0,184,148,.12);
            box-shadow: none;
        }

        .lesson-card .btn.secondary:hover {
            background: rgba(0,184,148,.2);
        }

        .lesson-card .btn.quiz {
            color: #9a5b00;
            border-color: rgba(255,152,0,.13);
            background: rgba(255,152,0,.14);
            box-shadow: none;
        }

        .lesson-card .btn.quiz:hover {
            background: rgba(255,152,0,.22);
        }

        /* =================================================
           DYNAMIC CONTENT MEDIA
        ================================================= */

        #lessonContainer img,
        #lessonContainer video,
        #lessonContainer iframe {
            max-width: 100%;
            border-radius: 13px;
        }

        #lessonContainer img {
            height: auto;
        }

        #lessonContainer iframe {
            width: 100%;
            min-height: 230px;
            border: 0;
        }

        #lessonContainer pre,
        #lessonContainer code {
            max-width: 100%;
            overflow-x: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* =================================================
           BUTTON ACCESSIBILITY
        ================================================= */

        .lesson-card .btn:focus-visible {
            outline: 3px solid rgba(120,101,220,.4);
            outline-offset: 3px;
        }

        /* =================================================
           ANIMATIONS
        ================================================= */

        @keyframes lessonPageEnter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes lessonCardEnter {
            from {
                opacity: 0;
                transform: translateY(13px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #lessonContainer .lesson-card:nth-child(1) {
            animation-delay: .05s;
        }

        #lessonContainer .lesson-card:nth-child(2) {
            animation-delay: .1s;
        }

        #lessonContainer .lesson-card:nth-child(3) {
            animation-delay: .15s;
        }

        #lessonContainer .lesson-card:nth-child(4) {
            animation-delay: .2s;
        }

        /* =================================================
           RESPONSIVE TABLET
        ================================================= */

        @media (max-width: 900px) {
            .phone {
                padding: 22px 17px 35px;
            }

            #lessonContainer {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* =================================================
           RESPONSIVE MOBILE
        ================================================= */

        @media (max-width: 600px) {
            .phone {
                min-height: calc(100vh - 55px);
                padding: 15px 12px 28px;
            }

            .header {
                padding: 20px;
                margin-bottom: 18px;
                border-radius: 17px;
            }

            .header h1 {
                font-size: 25px;
            }

            .header p {
                font-size: 12px;
            }

            #lessonContainer {
                grid-template-columns: minmax(0, 1fr);
                gap: 13px;
            }

            .lesson-card {
                min-height: 0;
                padding: 19px;
                border-radius: 16px;
            }

            .lesson-card h3 {
                font-size: 16px;
            }

            .lesson-card p {
                font-size: 12px;
            }

            .lesson-card .btn {
                min-height: 46px;
            }
        }

        /* =================================================
           SMALL DEVICES
        ================================================= */

        @media (max-width: 360px) {
            .phone {
                padding-inline: 9px;
            }

            .header {
                padding: 17px;
            }

            .lesson-card {
                padding: 16px;
            }
        }

        /* =================================================
           REDUCED MOTION
        ================================================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* =================================================
           BACKDROP FILTER FALLBACK
        ================================================= */

        @supports not (backdrop-filter: blur(10px)) {
            .lesson-card {
                background: rgba(255,255,255,.97);
            }
        }
    </style>
    <link rel="stylesheet" href="../assets/css/responsive-layout.css">
</head>

<body>

    <main class="phone">

        <header class="header">

            <div class="header-content">
                <span class="header-label">Student Learning Space</span>

                <h1>Lessons</h1>

                <p>
                    Explore your learning materials, review lesson content,
                    and complete your activities at your own pace.
                </p>
            </div>

        </header>

        <div id="lessonContainer">
            <div class="lesson-card">
                <p>Loading lessons...</p>
            </div>
        </div>

    </main>

    <!-- LESSON DATA AND INTERACTIONS -->
    <script type="module" src="../assets/js/lesson.js"></script>

    <!-- EQUALLEARN APPLICATION SHELL -->
    <script type="module" src="../assets/js/ui-shell.js"></script>

    <!-- PWA AND THEME -->
    <script type="module" src="../assets/js/pwa.js"></script>
    <script type="module" src="../assets/js/theme.js"></script>

<!-- EQUALLEARN LUMI COMPANION -->
<iframe
  src="../assets/widgets/lumi.html"
  title="Lumi — EqualLearn Companion"
  id="equallearn-lumi-frame"
  allow="autoplay"
  style="
    position: fixed;
    right: 8px;
    bottom: 8px;
    width: 210px;
    height: 255px;
    border: 0;
    background: transparent;
    z-index: 99999;
    overflow: hidden;
    pointer-events: auto;
  ">
</iframe>


</body>
</html>
