<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#635bff">
  <title>Take Quiz | EqualLearn</title>

  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/equallearn.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f3ff;
      color: #24243a;
      font-family: inherit;
    }

    .quiz-shell {
      max-width: 850px;
      margin: auto;
      padding: 24px 16px 60px;
    }

    .quiz-header, .quiz-card, .quiz-resources {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 8px 28px rgba(30,30,70,.07);
    }

    .quiz-header h1 { margin: 0 0 8px; }
    .muted { color: #77778b; }

    .progress-track {
      height: 9px;
      background: #ededf7;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 18px;
    }

    #progressBar {
      height: 100%;
      width: 0;
      background: #6c63ff;
      transition: width .25s;
    }

    .choice {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid #e4e4f0;
      background: #fafaff;
      border-radius: 12px;
      padding: 15px;
      margin: 10px 0;
      cursor: pointer;
      font: inherit;
    }

    .choice.selected {
      border: 2px solid #6c63ff;
      background: #f0efff;
    }

    .choice:disabled { cursor: default; }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
    }

    button.primary {
      background: #6c63ff;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 13px 22px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #ededf7;
      color: #444;
      border: 0;
      border-radius: 12px;
      padding: 13px 22px;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    #message {
      padding: 14px;
      border-radius: 12px;
      background: #fff3cd;
      color: #765b00;
      display: none;
      margin-bottom: 15px;
    }

    /* Learning resources and inline PDF viewer */
    .quiz-resources { display: none; }
    .resource-heading { margin: 0 0 6px; font-size: 20px; color: #24243a; }
    .resource-intro { margin: 0 0 16px; color: #77778b; font-size: 14px; }
    .resource-list { display: grid; gap: 14px; }
    .resource-item {
      min-width: 0;
      padding: 15px;
      border: 1px solid #e7e6f3;
      border-radius: 14px;
      background: #fcfcff;
    }
    .resource-title { margin-bottom: 12px; font-weight: 700; overflow-wrap: anywhere; }
    .resource-pdf-viewer {
      display: block;
      width: 100%;
      height: min(70vh, 720px);
      min-height: 420px;
      border: 1px solid #e1e0ed;
      border-radius: 10px;
      background: #f1f1f5;
    }
    .resource-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
    .resource-link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 10px;
      color: #fff;
      background: #6c63ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
    .resource-link-button.secondary { color: #444; background: #ededf7; }

    @media(max-width: 600px) {
      .quiz-header, .quiz-card, .quiz-resources { padding: 18px; }
      .actions { flex-direction: column; }
      .actions button { width: 100%; }
      .resource-pdf-viewer { min-height: 360px; height: 65vh; }
      .resource-link-button { flex: 1 1 120px; }
    }
  </style>
    <link rel="stylesheet" href="../assets/css/responsive-layout.css">
    <link rel="stylesheet" href="../assets/css/responsive-auto-fit.css">
</head>

<body>
  <main class="quiz-shell">
    <header class="quiz-header">
      <p class="muted">EQUALLEARN · ASSESSMENT</p>
      <h1 id="quizTitle">Loading quiz...</h1>
      <p id="quizDescription" class="muted"></p>

      <div class="progress-track">
        <div id="progressBar"></div>
      </div>
      <p id="questionProgress" class="muted">Preparing questions...</p>
      <p id="timer" class="muted"></p>
    </header>

    <div id="message"></div>

    <!-- Learning materials are shown here, before the quiz questions. -->
    <section class="quiz-resources" id="quizResources" aria-label="Quiz learning materials"></section>

    <section class="quiz-card" id="quizCard">
      <p>Loading your quiz...</p>
    </section>

    <div class="actions">
      <button class="secondary" id="exitBtn" type="button">Back to Classwork</button>
      <button class="primary" id="nextBtn" type="button" disabled>
        Next Question
      </button>
    </div>
  </main>

  <script type="module" src="../assets/js/quiz.js"></script>
  <script type="module" src="../assets/js/pwa.js"></script>
</body>
</html>
