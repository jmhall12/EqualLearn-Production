<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#635bff">
  <title>Take Quiz | EqualLearn</title>

  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/equallearn.css">

  <style>
    :root {
      color-scheme: dark;
      --quiz-bg: #0b1020;
      --quiz-panel: #121a2d;
      --quiz-panel-raised: #17223a;
      --quiz-panel-soft: #1a2640;
      --quiz-border: rgba(166, 181, 224, .14);
      --quiz-border-strong: rgba(163, 139, 255, .42);
      --quiz-text: #f2f4ff;
      --quiz-muted: #a6b0ca;
      --quiz-muted-soft: #7f8ba8;
      --quiz-purple: #9278f4;
      --quiz-purple-strong: #765de2;
      --quiz-cyan: #38b8d4;
      --quiz-success: #79dfbb;
      --quiz-shadow: 0 12px 32px rgba(0,0,0,.20);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--quiz-bg) !important;
      color-scheme: dark;
    }

    body,
    html body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(110, 86, 220, .10), transparent 34%),
        var(--quiz-bg) !important;
      color: var(--quiz-text) !important;
      font-family: "DM Sans", "Plus Jakarta Sans", Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main.quiz-shell {
      width: min(100% - 32px, 1020px) !important;
      max-width: 1020px !important;
      min-width: 0;
      margin: 0 auto !important;
      padding: 22px 0 38px !important;
    }

    .quiz-header,
    .quiz-card,
    .quiz-resources {
      min-width: 0;
      margin: 0 0 14px !important;
      padding: 20px 22px !important;
      border: 1px solid var(--quiz-border) !important;
      border-radius: 19px !important;
      background: linear-gradient(145deg, rgba(21,30,51,.98), rgba(16,24,43,.98)) !important;
      color: var(--quiz-text) !important;
      box-shadow: var(--quiz-shadow) !important;
    }

    .quiz-header {
      position: relative;
      padding-bottom: 18px !important;
      overflow: hidden;
    }

    .quiz-header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 7%;
      width: 86%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(173,153,255,.45), transparent);
      pointer-events: none;
    }

    .quiz-header > p:first-child {
      margin: 0 0 7px !important;
      color: #a999f5 !important;
      font-size: 10px !important;
      font-weight: 800 !important;
      letter-spacing: .14em !important;
      text-transform: uppercase;
    }

    .quiz-header h1 {
      margin: 0 !important;
      color: var(--quiz-text) !important;
      font-size: clamp(21px, 3vw, 28px) !important;
      font-weight: 800 !important;
      line-height: 1.2;
      letter-spacing: -.045em;
      overflow-wrap: anywhere;
    }

    #quizDescription {
      margin: 6px 0 0 !important;
      color: var(--quiz-muted) !important;
      font-size: 13px !important;
      line-height: 1.55;
    }

    .muted {
      color: var(--quiz-muted) !important;
    }

    .progress-track {
      width: 100%;
      height: 6px !important;
      margin: 15px 0 9px !important;
      overflow: hidden;
      border: 0 !important;
      border-radius: 999px !important;
      background: rgba(157,169,201,.16) !important;
    }

    #progressBar {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--quiz-purple), #7764e9 60%, var(--quiz-cyan)) !important;
      box-shadow: 0 0 14px rgba(137,111,244,.24);
      transition: width .22s ease;
    }

    #questionProgress {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      margin: 0 !important;
      color: var(--quiz-muted) !important;
      font-size: 11px !important;
      font-weight: 700;
    }

    #timer {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      margin: 0 0 0 10px !important;
      padding: 3px 9px;
      border: 1px solid rgba(161,139,255,.22);
      border-radius: 999px;
      background: rgba(137,111,244,.10);
      color: #c9bdff !important;
      font-size: 11px !important;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    #timer:empty { display: none; }

    #message {
      display: none;
      margin: 0 0 13px !important;
      padding: 12px 15px !important;
      border: 1px solid rgba(255,193,105,.22) !important;
      border-radius: 13px !important;
      background: rgba(255,193,105,.09) !important;
      color: #ffd99c !important;
      font-size: 13px;
      line-height: 1.5;
    }

    .quiz-resources {
      padding: 17px 19px !important;
      background: linear-gradient(145deg, rgba(19,28,48,.96), rgba(15,23,41,.96)) !important;
    }

    .resource-heading {
      margin: 0 0 4px !important;
      color: var(--quiz-text) !important;
      font-size: 15px !important;
      font-weight: 800 !important;
      letter-spacing: -.02em;
    }

    .resource-intro {
      margin: 0 0 11px !important;
      color: var(--quiz-muted) !important;
      font-size: 11px !important;
      line-height: 1.5;
    }

    .resource-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 9px !important;
    }

    .resource-item {
      min-width: 0;
      padding: 12px !important;
      border: 1px solid var(--quiz-border) !important;
      border-radius: 13px !important;
      background: rgba(255,255,255,.025) !important;
      color: var(--quiz-text) !important;
    }

    .resource-title {
      margin: 0 0 9px !important;
      color: #edf0ff !important;
      font-size: 12px !important;
      font-weight: 750 !important;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .resource-pdf-viewer {
      display: block;
      width: 100%;
      height: min(44vh, 380px) !important;
      min-height: 230px !important;
      border: 1px solid var(--quiz-border) !important;
      border-radius: 10px !important;
      background: #f4f5fa !important;
    }

    .resource-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px !important;
      margin-top: 10px !important;
    }

    a.resource-link-button,
    .resource-link-button {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      padding: 8px 12px !important;
      border: 1px solid rgba(255,255,255,.10) !important;
      border-radius: 10px !important;
      background: linear-gradient(135deg, #8e72ed, #6f58d6) !important;
      color: #fff !important;
      font-size: 11px !important;
      font-weight: 800 !important;
      text-decoration: none !important;
      transition: filter .16s ease, transform .16s ease;
    }

    a.resource-link-button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    a.resource-link-button.secondary,
    .resource-link-button.secondary {
      border-color: var(--quiz-border) !important;
      background: rgba(255,255,255,.06) !important;
      color: #dbe1f5 !important;
    }

    .quiz-card {
      padding: 22px !important;
      min-height: 185px;
    }

    .quiz-card > h2 {
      margin: 0 0 17px !important;
      color: var(--quiz-text) !important;
      font-size: clamp(18px, 2.4vw, 22px) !important;
      font-weight: 800 !important;
      line-height: 1.45;
      letter-spacing: -.025em;
      overflow-wrap: anywhere;
    }

    .quiz-answer-area {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      min-width: 0;
    }

    button.choice,
    .choice {
      display: flex !important;
      width: 100% !important;
      min-width: 0;
      min-height: 54px;
      align-items: center;
      margin: 0 !important;
      padding: 13px 15px !important;
      border: 1px solid rgba(166,181,224,.17) !important;
      border-radius: 13px !important;
      background: linear-gradient(145deg, #1a2640, #172139) !important;
      color: #edf1ff !important;
      text-align: left !important;
      font-family: inherit !important;
      font-size: 13px !important;
      font-weight: 650 !important;
      line-height: 1.5 !important;
      white-space: normal;
      overflow-wrap: anywhere;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button.choice:hover:not(:disabled) {
      border-color: rgba(167,145,255,.48) !important;
      background: #202c49 !important;
    }

    button.choice:active:not(:disabled) {
      transform: scale(.992);
    }

    button.choice.selected,
    button.choice.selected:hover {
      border: 1px solid var(--quiz-border-strong) !important;
      background: linear-gradient(145deg, rgba(126,100,225,.24), rgba(71,91,160,.18)) !important;
      color: #fff !important;
      box-shadow: inset 0 0 0 1px rgba(167,145,255,.12), 0 0 0 2px rgba(137,111,244,.07);
    }

    button.choice:disabled {
      cursor: default;
      opacity: .72;
    }

    .quiz-answer-area textarea,
    .quiz-answer-area input {
      width: 100% !important;
      min-height: 52px;
      padding: 13px 15px !important;
      border: 1px solid rgba(166,181,224,.18) !important;
      border-radius: 12px !important;
      outline: none;
      background: #172139 !important;
      color: var(--quiz-text) !important;
      font: inherit !important;
      font-size: 14px !important;
      line-height: 1.55;
      box-shadow: none !important;
    }

    .quiz-answer-area textarea {
      min-height: 150px;
      resize: vertical;
    }

    .quiz-answer-area textarea::placeholder,
    .quiz-answer-area input::placeholder {
      color: #8290ad !important;
    }

    .quiz-answer-area textarea:focus,
    .quiz-answer-area input:focus {
      border-color: rgba(167,145,255,.62) !important;
      box-shadow: 0 0 0 3px rgba(137,111,244,.12) !important;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 14px 0 0 !important;
    }

    .actions button,
    button.primary,
    button.secondary {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      margin: 0 !important;
      padding: 11px 17px !important;
      border: 1px solid transparent !important;
      border-radius: 12px !important;
      font-family: inherit !important;
      font-size: 12px !important;
      font-weight: 800 !important;
      line-height: 1.2;
      cursor: pointer;
      transition: filter .16s ease, transform .16s ease, opacity .16s ease;
    }

    button.primary {
      background: linear-gradient(110deg, #9277f1, #7059db) !important;
      color: #fff !important;
      box-shadow: 0 7px 20px rgba(112,89,219,.20);
    }

    button.secondary {
      border-color: var(--quiz-border) !important;
      background: rgba(255,255,255,.055) !important;
      color: #d5dcf0 !important;
    }

    .actions button:hover:not(:disabled) {
      filter: brightness(1.07);
      transform: translateY(-1px);
    }

    button:disabled,
    .actions button:disabled {
      opacity: .42 !important;
      cursor: not-allowed !important;
      transform: none !important;
      box-shadow: none !important;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(172,153,255,.72) !important;
      outline-offset: 3px;
    }

    @media (max-width: 700px) {
      main.quiz-shell {
        width: min(100% - 22px, 560px) !important;
        padding: 12px 0 26px !important;
      }

      .quiz-header,
      .quiz-card,
      .quiz-resources {
        margin-bottom: 10px !important;
        padding: 16px !important;
        border-radius: 15px !important;
      }

      .quiz-header > p:first-child { font-size: 9px !important; }
      .quiz-header h1 { font-size: 21px !important; }
      #quizDescription { font-size: 12px !important; }
      .progress-track { margin-top: 12px !important; }

      .quiz-resources { padding: 14px !important; }
      .resource-list { grid-template-columns: minmax(0, 1fr); }
      .resource-item { padding: 11px !important; }
      .resource-pdf-viewer {
        height: 42vh !important;
        min-height: 220px !important;
        max-height: 340px;
      }

      .quiz-card { min-height: 0; }
      .quiz-card > h2 {
        margin-bottom: 14px !important;
        font-size: 18px !important;
      }
      .quiz-answer-area { grid-template-columns: minmax(0, 1fr); gap: 8px; }
      button.choice { min-height: 50px; padding: 12px 13px !important; font-size: 12px !important; }

      .actions {
        position: sticky;
        bottom: max(8px, env(safe-area-inset-bottom));
        z-index: 5;
        padding: 8px;
        border: 1px solid rgba(166,181,224,.12);
        border-radius: 14px;
        background: rgba(11,16,32,.92);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }
      .actions button { min-height: 43px; padding: 10px 12px !important; font-size: 11px !important; }
      #exitBtn { flex: 1 1 42%; }
      #nextBtn { flex: 1 1 58%; }
    }

    @media (max-width: 360px) {
      main.quiz-shell { width: calc(100% - 18px) !important; }
      .actions { gap: 7px; }
      .actions button { padding-inline: 9px !important; }
      .resource-link-button { flex: 1 1 auto; }
    }

    @media (min-width: 701px) and (max-width: 980px) {
      main.quiz-shell { width: min(100% - 28px, 900px) !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="quiz-shell">
    <header class="quiz-header">
      <p class="muted">EQUALLEARN · ASSESSMENT</p>
      <h1 id="quizTitle">Loading quiz...</h1>
      <p id="quizDescription" class="muted"></p>

      <div class="progress-track">
        <div id="progressBar"></div>
      </div>
      <p id="questionProgress" class="muted">Preparing questions...</p>
      <p id="timer" class="muted"></p>
    </header>

    <div id="message"></div>

    <!-- Learning materials are shown here, before the quiz questions. -->
    <section class="quiz-resources" id="quizResources" aria-label="Quiz learning materials"></section>

    <section class="quiz-card" id="quizCard">
      <p>Loading your quiz...</p>
    </section>

    <div class="actions">
      <button class="secondary" id="exitBtn" type="button">Back to Classwork</button>
      <button class="primary" id="nextBtn" type="button" disabled>
        Next Question
      </button>
    </div>
  </main>

  <script type="module" src="../assets/js/quiz.js"></script>
  <script type="module" src="../assets/js/pwa.js"></script>
</body>
</html>
