
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">

  <title>Assignment | EqualLearn</title>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/equallearn.css">
  <link rel="icon" href="../assets/icons/equallearn-logo.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1020;
      color: #f4f7ff;
      font-family: Arial, sans-serif;
    }

    .assignment-page {
      width: min(900px, 100%);
      margin: auto;
      padding: 30px 20px 60px;
    }

    .assignment-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .assignment-top h1 {
      font-size: 25px;
      margin: 0;
    }

    .assignment-card {
      background: #111a2e;
      border: 1px solid #293650;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }

    .assignment-title {
      font-size: 27px;
      line-height: 1.3;
      margin: 0 0 12px;
      overflow-wrap: anywhere;
    }

    .assignment-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 18px 0 25px;
    }

    .assignment-badge {
      padding: 7px 11px;
      border-radius: 30px;
      background: #25234e;
      color: #b8b2ff;
      font-size: 12px;
      font-weight: 700;
    }

    .assignment-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #293650;
    }

    .assignment-section h2 {
      font-size: 16px;
      margin: 0 0 12px;
    }

    .assignment-description {
      color: #c2cce0;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assignment-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 15px;
      margin-top: 10px;
      border: 1px solid #34415e;
      border-radius: 12px;
      color: #c5c0ff;
      text-decoration: none;
      overflow-wrap: anywhere;
      background: #151f35;
    }

    .assignment-link:hover {
      background: #202b43;
    }

    .assignment-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 11px 17px;
      border: 0;
      border-radius: 10px;
      background: #635bff;
      color: white;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .assignment-button.secondary {
      background: #202b43;
      border: 1px solid #34415e;
    }

    .assignment-status {
      padding: 22px;
      border-radius: 13px;
      background: #151f35;
      color: #c2cce0;
      text-align: center;
      line-height: 1.6;
    }

    .assignment-status.error {
      color: #ff9caa;
      border: 1px solid #63313e;
    }

    .assignment-status.loading {
      color: #b8b2ff;
    }

    .assignment-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .muted {
      color: #91a0b8;
      font-size: 13px;
    }

    @media(max-width:600px) {
      .assignment-page { padding: 18px 12px 40px; }
      .assignment-card { padding: 19px; }
      .assignment-title { font-size: 22px; }
      .assignment-footer > * { width: 100%; }
    }
  </style>
</head>

<body>

  <main class="assignment-page">

    <header class="assignment-top">
      <div>
        <h1>📝 Assignment</h1>
        <p class="muted">EqualLearn Student Workspace</p>
      </div>

      <a class="assignment-button secondary" href="modules.html">
        ← Back to Classwork
      </a>
    </header>

    <div id="assignmentStatus" class="assignment-status loading">
      Loading assignment...
    </div>

    <article id="assignmentContent" class="assignment-card" hidden>

      <div class="muted">YOUR CLASS ASSIGNMENT</div>

      <h2 class="assignment-title" id="assignmentTitle"></h2>

      <div class="assignment-meta">
        <span class="assignment-badge" id="assignmentPoints"></span>
        <span class="assignment-badge" id="assignmentDue"></span>
        <span class="assignment-badge" id="assignmentStatusBadge"></span>
      </div>

      <section class="assignment-section">
        <h2>Instructions</h2>
        <div class="assignment-description" id="assignmentInstructions"></div>
      </section>

      <section class="assignment-section" id="resourcesSection" hidden>
        <h2>Learning Resources</h2>
        <div id="assignmentResources"></div>
      </section>

      <footer class="assignment-footer">
        <a class="assignment-button secondary" href="modules.html">
          ← Back to Classwork
        </a>
      </footer>

    </article>

  </main>

  <script type="module" src="../assets/js/assignment.js"></script>
  <script type="module" src="../assets/js/ui-shell.js"></script>
  <script type="module" src="../assets/js/pwa.js"></script>
  <script type="module" src="../assets/js/theme.js"></script>

<!-- EQUALLEARN LUMI COMPANION -->
<iframe
  src="/assets/widgets/lumi.html"
  title="Lumi — EqualLearn Companion"
  id="equallearn-lumi-frame"
  allow="autoplay"
  style="
    position: fixed;
    right: 8px;
    bottom: 8px;
    width: 210px;
    height: 255px;
    border: 0;
    background: transparent;
    z-index: 99999;
    overflow: hidden;
    pointer-events: auto;
  ">
</iframe>

</body>
</html>
