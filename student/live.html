
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#635bdb">
  <title>EqualLearn Live</title>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/equallearn.css">
  <link rel="stylesheet" href="../assets/css/glass-dashboard.css">
  <link rel="stylesheet" href="../assets/css/sidebar-skeuomorphism.css">

  <style>
:root{color-scheme:dark;--live-bg:#0b1020;--live-card:#151d30;--live-surface:#111a2c;--live-text:#edf1fb;--live-muted:#9ba8c2;--live-primary:#887bff;--live-border:#293650;--live-green:#36d68a;}
html,body{min-height:100%;background:var(--live-bg)!important;color:var(--live-text);}
.live-page{width:min(1440px,100%);margin:0 auto;padding:clamp(12px,2vw,24px);}
.live-card{padding:14px;border:1px solid var(--live-border);border-radius:18px;background:var(--live-card);box-shadow:0 14px 36px #0002;}
.live-card-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;}
.live-list-heading{display:flex;align-items:center;gap:9px;min-width:0;}
.live-list-heading strong{font-size:14px;font-weight:800;letter-spacing:.02em;}
.live-count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:20px;background:#887bff22;color:#b7adff;font-size:11px;font-weight:800;}
.live-auto-state{display:inline-flex;align-items:center;gap:7px;color:var(--live-muted);font-size:11px;white-space:nowrap;}
.live-auto-state:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live-green);box-shadow:0 0 0 4px #36d68a18;}
.student-live-list{display:grid;grid-template-columns:1fr;gap:8px;}
.student-live-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 14px;padding:12px 14px;border:1px solid var(--live-border);border-radius:13px;background:#10192b;color:var(--live-text);}
.student-live-card-header{display:flex;align-items:center;gap:9px;min-width:0;margin:0;}
.student-live-card h4{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:800;color:var(--live-text);}
.student-live-status{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;padding:4px 8px;border-radius:999px;background:#d99a571a;color:#e5ae69;font-size:9px;font-weight:850;letter-spacing:.04em;}
.student-live-status.is-live{background:#36d68a1c;color:#58e6a0;}
.student-live-status.is-live:before{content:"";width:6px;height:6px;border-radius:50%;background:#36d68a;}
.student-live-status.is-ended{background:#94a3b81a;color:#aab5c8;}
.student-live-meta{grid-column:1;display:inline-block;margin:0;color:var(--live-muted);font-size:11px;line-height:1.45;}
.student-live-meta + .student-live-meta{margin-left:14px;}
.student-live-description{display:none!important;}
.student-join-btn{grid-column:2;grid-row:1 / span 2;min-width:112px;width:auto;margin:0;padding:9px 14px;border:1px solid #887bff44;border-radius:10px;background:linear-gradient(135deg,#8068f4,#684fe0);color:#fff;font-size:11px;font-weight:850;cursor:pointer;transition:filter .18s ease,transform .18s ease;}
.student-join-btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);}
.student-join-btn:disabled{opacity:.48;cursor:not-allowed;}
.live-empty{padding:24px 12px;text-align:center;color:var(--live-muted);border:1px dashed var(--live-border);border-radius:13px;font-size:12px;}
#studentLiveMessage{margin:9px 3px 0;color:var(--live-muted);font-size:11px;}

/* Full-screen meeting */
#studentMeetingScreen{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;overflow:hidden;background:#080d19;color:#edf1fb;}
#studentMeetingScreen[hidden]{display:none!important;}
.meeting-topbar{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px;background:#111a2c;border-bottom:1px solid #293650;}
.meeting-session-info{min-width:0;display:flex;flex-direction:column;gap:3px;}
.meeting-brand{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:850;color:#f5f6ff;}
.meeting-subtitle{display:flex;align-items:center;gap:7px;color:#9ba8c2;font-size:10px;}
.meeting-top-actions{display:flex;align-items:center;gap:7px;}
.meeting-top-actions button{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid #34425e;border-radius:10px;background:#1b2940;color:#e9edfa;font-size:11px;font-weight:750;cursor:pointer;}
.meeting-top-actions svg{width:16px;height:16px;}
.meeting-layout{position:relative;display:grid;grid-template-columns:minmax(0,1fr);flex:1;min-height:0;overflow:hidden;}
.meeting-layout.with-sidebar{grid-template-columns:minmax(0,1fr) 320px;}
.meeting-stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px;overflow:hidden;}
.meeting-notice{flex:0 0 auto;min-height:18px;margin:0 0 8px;color:#9ba8c2;font-size:11px;}
.meeting-grid{display:grid;flex:1;min-height:0;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));grid-auto-rows:minmax(170px,1fr);align-content:center;gap:10px;overflow:auto;}
.sm-tile{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:150px;aspect-ratio:16/9;overflow:hidden;border:1px solid #34415d;border-radius:14px;background:radial-gradient(circle at 50% 35%,#293653,#182236 70%);}
.sm-tile video{display:block;width:100%;height:100%;object-fit:cover;background:#080d19;}
.sm-tile video.sm-local-video{transform:scaleX(-1);}
.sm-tile audio{display:none!important;}
.sm-name{position:absolute;z-index:3;left:10px;bottom:9px;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 8px;border:1px solid #ffffff18;border-radius:7px;background:#050914bb;color:#fff;font-size:10px;font-weight:750;}
.sm-placeholder{display:grid;place-items:center;padding:15px;color:#aab5cb;font-size:12px;text-align:center;}
.sm-placeholder:before{content:"";width:46px;height:46px;margin-bottom:8px;border:1px solid #64748b55;border-radius:50%;background:#64748b22;}
.sm-hand-indicator,.live-hand-indicator{position:absolute;z-index:4;top:9px;right:9px;display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#fbbf2430;border:1px solid #fbbf2466;color:#ffe29a;font-size:10px;font-weight:800;}
.sm-hand-indicator svg,.live-hand-indicator svg{width:13px;height:13px;}
.sm-tile.screen-share-tile{grid-column:1/-1;min-height:0;aspect-ratio:auto;background:#02050a;border-color:#65748f;}
.sm-tile.screen-share-tile video{object-fit:contain!important;background:#02050a;}
#studentMeetingScreen.has-screen-share .meeting-layout{grid-template-columns:minmax(0,1fr)!important;}
#studentMeetingScreen.has-screen-share .meeting-sidebar{display:none!important;}
#studentMeetingScreen.has-screen-share .meeting-stage{padding:0;}
#studentMeetingScreen.has-screen-share .meeting-notice{position:absolute;top:8px;left:12px;z-index:9;padding:5px 8px;border-radius:8px;background:#050914aa;}
#studentMeetingScreen.has-screen-share .meeting-grid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:0;overflow:hidden;}
#studentMeetingScreen.has-screen-share .sm-tile:not(.screen-share-tile){display:none!important;}
#studentMeetingScreen.has-screen-share .sm-tile.screen-share-tile{width:100%;height:100%;min-height:0;grid-column:1/-1;border:0;border-radius:0;}
.meeting-sidebar{display:none;flex-direction:column;min-width:0;min-height:0;background:#111a2c;border-left:1px solid #293650;overflow:hidden;}
.meeting-sidebar.open{display:flex;}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px;border-bottom:1px solid #293650;}
.sidebar-header h3{margin:0;font-size:13px;font-weight:850;}
.sidebar-header button{display:grid;place-items:center;width:30px;height:30px;border:1px solid #34425e;border-radius:8px;background:#1b2940;color:#dce4f5;cursor:pointer;}
.sidebar-header svg{width:15px;height:15px;}
#studentMeetingPeople{flex:1;min-height:0;overflow:auto;padding:9px 12px;color:#dce4f5;font-size:11px;}
.sm-person{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 3px;border-bottom:1px solid #ffffff0d;}
.sm-person strong{font-size:11px;font-weight:750;}
.sm-person div{font-size:10px;color:#9ba8c2;}
#studentMeetingChat{display:flex;flex:1;min-height:0;flex-direction:column;gap:8px;overflow:auto;padding:12px;color:#dce4f5;font-size:11px;}
.sm-chat-item{display:flex;flex-direction:column;gap:3px;padding:8px 9px;border:1px solid #ffffff0d;border-radius:10px;background:#1a263b;overflow-wrap:anywhere;}
.sm-chat-item strong{font-size:10px;color:#b9adff;}
.sm-chat-item span{font-size:11px;line-height:1.45;}
.meeting-chat-form{display:flex;gap:7px;padding:10px;border-top:1px solid #293650;}
.meeting-chat-form input{min-width:0;flex:1;padding:10px;border:1px solid #34425e;border-radius:9px;background:#0e1728;color:#f3f5ff;font:inherit;font-size:11px;}
.meeting-chat-form button{display:grid;place-items:center;width:38px;border:0;border-radius:9px;background:#7663ef;color:#fff;cursor:pointer;}
.meeting-chat-form button svg{width:16px;height:16px;}
.meeting-controls{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:70px;padding:10px 12px;background:#10192b;border-top:1px solid #293650;}
.meeting-controls button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:94px;min-height:42px;padding:8px 12px;border:1px solid #3a4965;border-radius:11px;background:#202d44;color:#eef2ff;font-size:10px;font-weight:800;cursor:pointer;transition:background .15s ease,border-color .15s ease;}
.meeting-controls button svg{width:17px;height:17px;flex:0 0 auto;}
.meeting-controls button:hover:not(:disabled){background:#2c3b57;border-color:#7f74df;}
.meeting-controls button:disabled{opacity:.42;cursor:not-allowed;}
.meeting-controls button.is-off{background:#4b2635;border-color:#a44860;color:#ffd9e1;}
.meeting-controls button.is-active{background:#3a326e;border-color:#8b7cff;color:#fff;}
.meeting-controls button.is-raised{background:#59451d;border-color:#e9b44b;color:#ffe4a3;}
.meeting-controls button.leave-button{background:#b8324c;border-color:#d64a63;color:#fff;min-width:82px;}
.live-reaction-bar{display:flex;align-items:center;justify-content:center;gap:5px;flex:0 0 auto;order:-1;max-width:100%;padding:2px 6px;overflow-x:auto;}
.live-reaction-button{display:grid;place-items:center;min-width:34px!important;width:34px;height:32px;min-height:32px!important;padding:3px!important;border-radius:999px!important;font-size:17px!important;line-height:1;}
.live-fullscreen-button{min-width:42px!important;width:42px;padding:8px!important;}
.live-fullscreen-button svg{width:17px;height:17px;}
.sm-hidden{display:none!important;}
.live-reaction-pop{position:absolute;z-index:8;top:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 10px;border:1px solid #ffffff1c;border-radius:12px;background:#111827ed;box-shadow:0 8px 24px #0008;animation:equalReactionFloat 2.4s ease forwards;pointer-events:none;}
.live-reaction-emoji{font-size:27px;line-height:1.1;}
.live-reaction-pop small{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;font-size:9px;}
@keyframes equalReactionFloat{0%{opacity:0;transform:translateY(12px) scale(.75)}15%{opacity:1;transform:translateY(0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-20px) scale(.95)}}
.hand-raise-toast{position:absolute;z-index:30;top:14px;left:50%;display:flex;align-items:center;gap:8px;max-width:min(92vw,360px);padding:10px 14px;transform:translateX(-50%);border:1px solid #fbbf2466;border-radius:12px;background:#1d2638f5;color:#fff0c2;box-shadow:0 10px 32px #0007;font-size:11px;font-weight:800;animation:toastIn .18s ease-out;pointer-events:none;}
.hand-raise-toast svg{width:17px;height:17px;flex:0 0 auto;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-7px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:760px){.live-page{padding:10px;}.live-card{padding:10px;border-radius:14px;}.student-live-card{padding:10px;}.student-join-btn{min-width:96px;padding:8px 10px;}.meeting-topbar{min-height:52px;padding:8px 10px;}.meeting-top-actions button{padding:7px 8px;font-size:10px;}.meeting-layout.with-sidebar{grid-template-columns:1fr;}.meeting-sidebar.open{position:absolute;z-index:15;top:0;right:0;bottom:0;width:min(88vw,360px);box-shadow:-12px 0 34px #0007;}.meeting-stage{padding:7px;}.meeting-grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr));grid-auto-rows:minmax(110px,1fr);gap:7px;}.sm-tile{min-height:110px;border-radius:11px;}.meeting-controls{gap:6px;min-height:62px;padding:7px 6px;}.meeting-controls button{min-width:44px;min-height:42px;padding:8px;gap:5px;font-size:0;}.meeting-controls button svg{width:19px;height:19px;}.meeting-controls button.leave-button{min-width:55px;}.live-reaction-bar{order:-1;flex-basis:100%;}.live-reaction-button{font-size:17px!important;}}
@media(max-width:420px){.student-live-card{grid-template-columns:minmax(0,1fr) 90px;gap:7px;}.student-live-card h4{font-size:12px;}.student-live-meta{font-size:10px;}.student-join-btn{min-width:86px;font-size:10px;}.meeting-top-actions button span{display:none;}.meeting-grid{grid-template-columns:repeat(auto-fit,minmax(125px,1fr));}.sm-tile{min-height:95px;}}
@media(orientation:landscape) and (max-height:520px){.meeting-topbar{min-height:42px;padding:5px 10px;}.meeting-controls{min-height:54px;padding:5px;}.meeting-stage{padding:6px;}.meeting-grid{grid-auto-rows:minmax(85px,1fr);gap:6px;}.sm-tile{min-height:85px;}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important;}}
/* Lumi is suppressed while a call is active so it never covers meeting controls. */
body:has(#studentMeetingScreen.active) #equallearn-lumi-frame{display:none!important;}
</style>
</head>

<body>
  <main class="live-page">
    <section class="live-card" aria-label="Live classrooms">
      <div class="live-card-header">
        <div class="live-list-heading">
          <strong>Live classrooms</strong>
          <span class="live-count" id="liveSessionCount">0</span>
        </div>
        <span class="live-auto-state" id="liveAutoState">Auto-updating</span>
      </div>
      <div id="liveSessionList" class="student-live-list" aria-live="polite">
        <div class="live-empty">Loading your live classrooms…</div>
      </div>
      <p id="studentLiveMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <section id="studentMeetingScreen" hidden aria-label="EqualLearn meeting room">
    <div class="meeting-topbar">
      <div class="meeting-session-info">
        <div class="meeting-brand" id="studentMeetingTitle">EqualLearn Live</div>
        <span class="meeting-subtitle" id="studentMeetingNotice">Connecting to classroom…</span>
      </div>
      <div class="meeting-top-actions">
        <button type="button" id="studentPeopleTopBtn" aria-label="Show participants" title="Participants">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>People</span>
        </button>
        <button type="button" id="studentChatTopBtn" aria-label="Open chat" title="Chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg><span>Chat</span>
        </button>
      </div>
    </div>

    <div class="meeting-layout" id="studentMeetingLayout">
      <main class="meeting-stage">
        <div class="meeting-notice" id="studentMeetingConnection" role="status">Waiting for participants…</div>
        <div class="meeting-grid" id="studentParticipantGrid">
          <div class="sm-tile"><div class="sm-placeholder">Connecting to your classroom…</div></div>
        </div>
        <div id="studentMeetingToastHost" aria-live="polite"></div>
      </main>

      <aside class="meeting-sidebar" id="studentMeetingSidebar" aria-label="Meeting side panel">
        <div class="sidebar-header">
          <h3 id="studentSidebarTitle">Participants</h3>
          <button type="button" id="studentCloseSidebar" aria-label="Close side panel" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m18 6-12 12M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="studentMeetingPeople">Loading participants…</div>
        <div id="studentMeetingChat" class="sm-hidden"><p>Messages will appear here.</p></div>
        <form class="meeting-chat-form sm-hidden" id="studentMeetingChatForm">
          <input type="text" id="studentMeetingChatInput" placeholder="Send a message…" maxlength="500" autocomplete="off" aria-label="Message">
          <button type="submit" aria-label="Send message" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          </button>
        </form>
      </aside>
    </div>

    <footer class="meeting-controls" aria-label="Meeting controls">
      <button type="button" id="studentMeetingMic" disabled aria-label="Mute microphone" title="Microphone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg><span>Mute mic</span>
      </button>
      <button type="button" id="studentMeetingCamera" disabled aria-label="Turn camera off" title="Camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg><span>Turn camera off</span>
      </button>
      <button type="button" id="studentMeetingShare" disabled aria-label="Share screen" title="Share screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M12 13V7m-3 3 3-3 3 3"/></svg><span>Share screen</span>
      </button>
      <button type="button" id="studentMeetingRaiseHand" class="hand-button" aria-label="Raise hand" title="Raise hand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12V5a2 2 0 0 1 4 0v6-3a2 2 0 0 1 4 0v4-2a2 2 0 0 1 4 0v4c0 5-3 8-8 8h-1c-3.5 0-5.6-1.8-6.6-4.8L3 14.5a2 2 0 0 1 3.3-2.1L8 14"/></svg><span>Raise hand</span>
      </button>
      <button type="button" id="studentMeetingPeopleBtn" aria-label="Participants" title="Participants">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>People</span>
      </button>
      <button type="button" id="studentMeetingChatBtn" aria-label="Chat" title="Chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg><span>Chat</span>
      </button>
      <button type="button" id="studentMeetingLeave" class="leave-button" aria-label="Leave meeting" title="Leave">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span>Leave</span>
      </button>
    </footer>
  </section>

  <script type="module" src="../assets/js/student_live.js"></script>
  <script type="module" src="../assets/js/ui-shell.js"></script>
  <script type="module" src="../assets/js/pwa.js"></script>
  <script type="module" src="../assets/js/theme.js"></script>
  
</body>
</html>
