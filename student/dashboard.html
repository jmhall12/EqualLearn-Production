
<!DOCTYPE html>
<html lang="en">
<head>
  <script id="EQUALLEARN_FORCE_DARK_BOOTSTRAP">document.documentElement.dataset.theme="dark";document.documentElement.style.colorScheme="dark";</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">

    <title>Student Dashboard - EqualLearn</title>

    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" type="image/png" href="../assets/icons/equallearn-logo.png">

    <!-- EQUALLEARN TYPOGRAPHY -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- GLOBAL DESIGN SYSTEM -->
    <link rel="stylesheet" href="../assets/css/sidebar-skeuomorphism.css">
    <link rel="stylesheet" href="../assets/css/glass-dashboard.css">

    <style>
        .el-dashboard, .el-dashboard * { box-sizing: border-box; }
        .el-dashboard { width:100%; max-width:100%; min-width:0; margin:0; padding:20px clamp(14px,2vw,28px) 34px; }
        .student-overview-card { padding:20px; border-radius:20px; }
        .student-overview-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px; }
        .student-overview-eyebrow { display:block; margin-bottom:4px; color:#a995ff; font-size:10px; font-weight:800; letter-spacing:1.25px; text-transform:uppercase; }
        .student-overview-head h1 { margin:0; color:var(--el-text,#f3f2fb); font-size:19px; font-weight:800; letter-spacing:-.35px; }
        .student-continue-link { display:inline-flex; align-items:center; gap:7px; padding:9px 13px; border:1px solid rgba(161,139,255,.24); border-radius:11px; color:#d9d0ff; background:rgba(126,101,231,.13); font-size:11px; font-weight:750; text-decoration:none; white-space:nowrap; }
        .student-overview-layout { display:grid; grid-template-columns:minmax(0,1.12fr) minmax(260px,.88fr); gap:18px; align-items:stretch; }
        .student-class-details { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
        .student-profile-item { min-width:0; padding:13px 14px; border:1px solid rgba(255,255,255,.08); border-radius:14px; background:rgba(255,255,255,.035); }
        .student-profile-item span { display:block; color:#9da6bd; font-size:9px; font-weight:800; letter-spacing:.7px; text-transform:uppercase; }
        .student-profile-item strong { display:block; margin-top:6px; color:#f1f1fa; font-size:12px; font-weight:750; overflow-wrap:anywhere; }
        .student-progress-panel { display:flex; align-items:center; gap:15px; min-width:0; padding:14px 16px; border:1px solid rgba(161,139,255,.14); border-radius:15px; background:linear-gradient(120deg,rgba(126,101,231,.10),rgba(255,255,255,.025)); }
        .student-progress-circle { width:78px; height:78px; flex:0 0 78px; display:grid; place-items:center; border-radius:50%; background:conic-gradient(#9279f4 0 72%,rgba(150,156,180,.18) 72% 100%); }
        .student-progress-circle-inner { width:60px; height:60px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.08); border-radius:50%; color:#f4f2ff; background:#20243a; font-size:15px; font-weight:850; }
        .student-progress-copy { flex:1; min-width:0; }
        .student-progress-copy strong { color:#f2f1fb; font-size:12px; }
        .student-progress-copy p { margin:5px 0 10px; color:#a5aec3; font-size:11px; line-height:1.55; }
        .student-progress-track { width:100%; height:6px; overflow:hidden; border-radius:99px; background:rgba(159,166,190,.18); }
        .student-progress-track span { display:block; height:100%; width:72%; border-radius:inherit; background:linear-gradient(90deg,#9a83ff,#7058da); }
        .student-overview-note { margin-top:12px; color:#8792aa; font-size:10px; }
        @media(max-width:820px) { .student-overview-layout { grid-template-columns:1fr; } }
        @media(max-width:600px) {
          .el-dashboard { padding:14px 12px 24px; }
          .student-overview-card { padding:15px; }
          .student-overview-head { align-items:flex-start; flex-direction:column; }
          .student-continue-link { align-self:flex-start; }
          .student-class-details { grid-template-columns:1fr 1fr; }
          .student-profile-item:last-child { grid-column:1/-1; }
          .student-progress-panel { gap:12px; padding:12px; }
          .student-progress-circle { width:68px; height:68px; flex-basis:68px; }
          .student-progress-circle-inner { width:52px; height:52px; font-size:13px; }
        }
        @media(prefers-reduced-motion:reduce) { .student-overview-card *, .student-overview-card *::before, .student-overview-card *::after { animation:none!important; transition:none!important; } }
    </style>
    <link rel="stylesheet" href="../assets/css/responsive-layout.css">
    <link rel="stylesheet" href="../assets/css/responsive-auto-fit.css">
  <link rel="stylesheet" href="../assets/css/forced-dark-theme.css?v=1">
    <link rel="stylesheet" href="../assets/css/student-dashboard-overview.css">

<style id="student-dashboard-performance">
  .lumi-deferred-launcher {
    position: fixed !important;
    right: max(12px, env(safe-area-inset-right)) !important;
    bottom: max(12px, env(safe-area-inset-bottom)) !important;
    z-index: 2147483646 !important;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 42px;
    padding: 0 15px;
    border: 1px solid rgba(255,255,255,.78);
    border-radius: 24px;
    color: #fff;
    background: linear-gradient(135deg,#9c7cf4,#7051dc);
    box-shadow: 0 8px 24px rgba(74,52,153,.3);
    font: 800 12px "DM Sans",sans-serif;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .lumi-deferred-launcher svg { width: 17px; height: 17px; flex: 0 0 17px; }
  .lumi-deferred-launcher:disabled { opacity: .72; cursor: wait; }
  .lumi-deferred-launcher:focus-visible { outline: 3px solid #c6b8ff; outline-offset: 3px; }
  @media (max-width: 600px) {
    .lumi-deferred-launcher { right: 10px !important; bottom: max(10px, env(safe-area-inset-bottom)) !important; min-height: 40px; padding-inline: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { .lumi-deferred-launcher { transition: none; } }
</style>

</head>

<body>

<div class="el-dashboard">
    <!-- Keeps the student profile name available for UI Shell name sync without a duplicate greeting header. -->
    <span id="studentName" hidden></span>

    <section class="el-card student-overview-card" aria-labelledby="studentOverviewTitle">
        <div class="student-overview-head">
            <div>
                <span class="student-overview-eyebrow">Your learning space</span>
                <h1 id="studentOverviewTitle">Class & Learning Progress</h1>
            </div>
            <a class="student-continue-link" href="modules.html" aria-label="Continue learning">
                <span data-icon="book-open" aria-hidden="true"></span>
                Continue learning
            </a>
        </div>

        <div class="student-overview-layout">
            <div class="student-class-details" aria-label="Your class details">
                <div class="student-profile-item">
                    <span>Section</span>
                    <strong id="studentSection">Loading...</strong>
                </div>
                <div class="student-profile-item">
                    <span>Teacher</span>
                    <strong id="studentTeacher">Loading...</strong>
                </div>
                <div class="student-profile-item">
                    <span>Cohort</span>
                    <strong id="studentCohort">Loading...</strong>
                </div>
            </div>

            <div class="student-progress-panel" aria-label="Learning progress">
                <div class="student-progress-circle" role="img" aria-label="Learning progress 72 percent">
                    <div class="student-progress-circle-inner">72%</div>
                </div>
                <div class="student-progress-copy">
                    <strong>Weekly learning goal</strong>
                    <p>Complete your modules and quizzes to keep building your progress.</p>
                    <div class="student-progress-track" aria-hidden="true">
                        <span></span>
                    </div>
                </div>
            </div>
        </div>
        <p class="student-overview-note">Your class assignment and learning progress in one place.</p>
    </section>

    <a id="logout" href="../login.html" style="display:none">Logout</a>

    <!-- Lightweight launcher: the 3D companion iframe is created only on first tap. -->
    
</div>

<!-- Student profile and notification data -->
<script type="module" src="../assets/js/dashboard.js"></script>
<!-- Global application shell creates the topbar notification bell. -->
<script type="module" src="../assets/js/ui-shell.js"></script>
<script type="module" src="../assets/js/pwa.js"></script>
<script type="module" src="../assets/js/theme.js"></script>

<script defer src="../assets/js/lazy-lumi.js"></script>

</body>
</html>
