<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.dataset.theme="dark";document.documentElement.style.colorScheme="dark";</script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1020">
  <title>Change Password | EqualLearn</title>
  <link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../assets/icons/equallearn-logo.png">
  <link rel="stylesheet" href="../assets/css/glass-dashboard.css"><link rel="stylesheet" href="../assets/css/sidebar-skeuomorphism.css"><link rel="stylesheet" href="../assets/css/forced-dark-theme.css?v=1"><link rel="stylesheet" href="../assets/css/admin-settings.css?v=1">
</head>
<body>
  <main class="admin-settings-subpage">
    <div class="admin-settings-subpage__top"><a class="admin-settings-back" href="settings.html">← Settings</a></div>
    <header style="margin-bottom:16px"><p class="admin-settings-subpage__eyebrow">Security</p><h1 class="admin-settings-subpage__title">Change password</h1><p class="admin-settings-subpage__desc">Choose a new password for your administrator account.</p></header>
    <section class="admin-settings-panel">
      <h2>Update password</h2>
      <div id="passwordProviderNotice" class="admin-settings-callout" hidden></div>
      <div class="admin-settings-field"><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" placeholder="Enter current password"></div>
      <div class="admin-settings-field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters"></div>
      <div class="admin-settings-field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Repeat new password"></div>
      <div class="admin-settings-actions"><button id="changePassword" class="admin-settings-button" type="button">Update password</button><button id="resetPassword" class="admin-settings-button admin-settings-button--secondary" type="button">Email reset link</button></div>
      <div id="securityMessage" class="admin-settings-message" role="status" aria-live="polite"></div>
    </section>
    <div class="admin-settings-callout">For your security, Firebase may ask you to verify your current password before accepting a password change. Never share your password or reset link.</div>
  </main>
  <script type="module" src="../assets/js/admin-change-password.js"></script><script type="module" src="../assets/js/ui-shell.js"></script><script type="module" src="../assets/js/pwa.js"></script><script type="module" src="../assets/js/theme.js"></script>
  <iframe src="../assets/widgets/lumi.html" title="Lumi — EqualLearn Companion" id="equallearn-lumi-frame" allow="autoplay" allowtransparency="true" frameborder="0" scrolling="no"></iframe>
</body>
</html>
