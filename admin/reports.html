
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#635bff">

    <title>Student Reports | EqualLearn</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/reports.css">
    <link rel="stylesheet" href="../assets/css/glass-dashboard.css">
    <link rel="stylesheet" href="../assets/css/sidebar-skeuomorphism.css">

    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../assets/icons/equallearn-logo.png">

    <style>
        :root {
            --report-primary: #635bdb;
            --report-primary-dark: #5148c9;
            --report-text: #20243a;
            --report-muted: #858ba0;
            --report-border: rgba(255,255,255,.58);
            --report-glass: rgba(255,255,255,.62);
            --report-shadow: 0 12px 35px rgba(35,38,75,.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--report-text);
            background:
                radial-gradient(circle at 10% 5%, rgba(99,91,219,.15), transparent 33%),
                radial-gradient(circle at 90% 85%, rgba(120,170,255,.15), transparent 32%),
                linear-gradient(135deg, #f4f5ff, #edf0fa 55%, #f8f8ff);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                radial-gradient(rgba(99,91,219,.05) 1px, transparent 1px);
            background-size: 22px 22px;
        }

        /* MAIN PAGE */

        .reports-container {
            width: min(1400px, calc(100% - 40px));
            margin: 30px auto;
            padding: 28px;
            border: 1px solid var(--report-border);
            border-radius: 24px;
            background: var(--report-glass);
            box-shadow: var(--report-shadow);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            animation: reportFadeIn .5s ease both;
        }

        /* HEADER */

        .reports-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .reports-header h1 {
            margin: 0;
            color: var(--report-text);
            font-size: clamp(25px, 4vw, 34px);
            font-weight: 850;
            letter-spacing: -.8px;
        }

        .reports-header h1::after {
            content: "";
            display: block;
            width: 45px;
            height: 4px;
            margin-top: 10px;
            border-radius: 10px;
            background: linear-gradient(90deg, #635bdb, #9b94ff);
        }

        .reports-header p {
            margin: 9px 0 0;
            color: var(--report-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .back-btn {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 17px;
            border: 1px solid rgba(99,91,219,.15);
            border-radius: 11px;
            color: #514c83;
            background: rgba(255,255,255,.65);
            box-shadow: 0 5px 13px rgba(35,38,75,.05);
            font-size: 12px;
            font-weight: 750;
            cursor: pointer;
            transition: .2s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(99,91,219,.4);
            background: rgba(255,255,255,.95);
            color: var(--report-primary);
        }

        /* SUMMARY CARDS */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 22px;
        }

        .summary-card {
            position: relative;
            min-width: 0;
            overflow: hidden;
            padding: 21px;
            border: 1px solid rgba(255,255,255,.7);
            border-radius: 17px;
            background: rgba(255,255,255,.65);
            box-shadow: 0 7px 23px rgba(35,38,75,.055);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition:
                transform .22s ease,
                box-shadow .22s ease,
                border-color .22s ease;
        }

        .summary-card::after {
            content: "";
            position: absolute;
            top: -28px;
            right: -28px;
            width: 85px;
            height: 85px;
            border: 1px solid rgba(99,91,219,.1);
            border-radius: 50%;
            box-shadow: 0 0 0 13px rgba(99,91,219,.025);
            pointer-events: none;
        }

        .summary-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99,91,219,.22);
            box-shadow: 0 13px 30px rgba(35,38,75,.09);
        }

        .summary-card span {
            display: block;
            color: var(--report-muted);
            font-size: 12px;
            font-weight: 650;
        }

        .summary-card strong {
            position: relative;
            z-index: 1;
            display: block;
            margin-top: 11px;
            color: var(--report-text);
            font-size: 30px;
            font-weight: 850;
            letter-spacing: -.8px;
        }

        .summary-card .passing-text {
            color: #16834b;
        }

        .summary-card .failing-text {
            color: #d04455;
        }

        /* FILTER PANEL */

        .filter-card {
            display: grid;
            grid-template-columns: 1.5fr repeat(4, minmax(130px, 1fr));
            gap: 11px;
            margin-bottom: 20px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,.7);
            border-radius: 17px;
            background: rgba(255,255,255,.54);
            box-shadow: 0 6px 20px rgba(35,38,75,.045);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .filter-card input,
        .filter-card select {
            width: 100%;
            min-width: 0;
            min-height: 43px;
            padding: 10px 12px;
            border: 1px solid rgba(99,91,219,.15);
            border-radius: 10px;
            outline: none;
            background: rgba(255,255,255,.72);
            color: var(--report-text);
            font: inherit;
            font-size: 12px;
            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .filter-card input::placeholder {
            color: #969bb0;
        }

        .filter-card input:hover,
        .filter-card select:hover {
            border-color: rgba(99,91,219,.35);
            background: #fff;
        }

        .filter-card input:focus,
        .filter-card select:focus {
            border-color: var(--report-primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(99,91,219,.09);
        }

        /* REPORT TABLE */

        .table-card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 18px;
            background: rgba(255,255,255,.58);
            box-shadow: 0 8px 25px rgba(35,38,75,.055);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(99,91,219,.35) transparent;
        }

        .table-wrapper::-webkit-scrollbar {
            height: 7px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            border-radius: 10px;
            background: rgba(99,91,219,.3);
        }

        .table-wrapper table {
            width: 100%;
            min-width: 850px;
            border-collapse: separate;
            border-spacing: 0;
            color: var(--report-text);
            font-size: 12px;
        }

        .table-wrapper thead th {
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 16px 15px;
            border-bottom: 1px solid rgba(99,91,219,.15);
            background: rgba(99,91,219,.08);
            color: #57517f;
            font-size: 10px;
            font-weight: 850;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: .55px;
            white-space: nowrap;
        }

        .table-wrapper tbody td {
            padding: 15px;
            border-bottom: 1px solid rgba(40,45,75,.065);
            background: rgba(255,255,255,.25);
            vertical-align: middle;
        }

        .table-wrapper tbody tr {
            transition: background .18s ease;
        }

        .table-wrapper tbody tr:hover td {
            background: rgba(255,255,255,.82);
        }

        .table-wrapper tbody tr:last-child td {
            border-bottom: 0;
        }

        .table-wrapper tbody .loading {
            padding: 35px 15px;
            color: var(--report-muted);
            text-align: center;
            font-size: 13px;
        }

        /* ACCESSIBILITY */

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 3px solid rgba(99,91,219,.3);
            outline-offset: 3px;
        }

        /* ANIMATION */

        @keyframes reportFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* TABLET */

        @media (max-width: 1050px) {
            .filter-card {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .filter-card input {
                grid-column: span 3;
            }

            .summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* MOBILE */

        @media (max-width: 600px) {
            .reports-container {
                width: calc(100% - 22px);
                margin: 15px auto;
                padding: 19px 14px;
                border-radius: 19px;
            }

            .reports-header {
                align-items: flex-start;
            }

            .reports-header h1 {
                font-size: 25px;
            }

            .reports-header p {
                font-size: 12px;
            }

            .back-btn {
                min-height: 38px;
                padding: 9px 12px;
                font-size: 11px;
            }

            .summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .summary-card {
                padding: 15px;
                border-radius: 14px;
            }

            .summary-card strong {
                font-size: 25px;
            }

            .summary-card span {
                font-size: 11px;
            }

            .filter-card {
                grid-template-columns: 1fr 1fr;
                gap: 9px;
                padding: 13px;
            }

            .filter-card input {
                grid-column: 1 / -1;
            }

            .filter-card input,
            .filter-card select {
                min-height: 41px;
                font-size: 11px;
            }

            .table-card {
                border-radius: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }

        @supports not (backdrop-filter: blur(10px)) {
            .reports-container,
            .summary-card,
            .filter-card,
            .table-card {
                background: rgba(255,255,255,.94);
            }
        }
    </style>

</head>

<body>

<div class="reports-container">

    <!-- HEADER -->
    <div class="reports-header">

        <div>
            <h1>Student Reports</h1>

            <p>
                Monitor student grades and school status.
            </p>
        </div>

        <button
            type="button"
            class="back-btn"
            onclick="window.location.href='dashboard.html'">
            ← Back
        </button>

    </div>

    <!-- SUMMARY -->
    <div class="summary-grid">

        <div class="summary-card">
            <span>Total Students</span>
            <strong id="totalStudents">0</strong>
        </div>

        <div class="summary-card">
            <span>Passing</span>
            <strong id="passingStudents" class="passing-text">0</strong>
        </div>

        <div class="summary-card">
            <span>Failing</span>
            <strong id="failingStudents" class="failing-text">0</strong>
        </div>

        <div class="summary-card">
            <span>Active Students</span>
            <strong id="activeStudents">0</strong>
        </div>

    </div>

    <!-- FILTERS -->
    <div class="filter-card">

        <input
            type="text"
            id="searchStudent"
            placeholder="Search student name or ID..."
        >

        <select id="courseFilter">
            <option value="">All Courses</option>
        </select>

        <select id="yearFilter">
            <option value="">All Year Levels</option>
        </select>

        <select id="resultFilter">
            <option value="">All Results</option>
            <option value="passing">Passing</option>
            <option value="failing">Failing</option>
        </select>

        <select id="statusFilter">
            <option value="">All School Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
        </select>

    </div>

    <!-- REPORT TABLE -->
    <div class="table-card">

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Student ID</th>
                        <th>Course</th>
                        <th>Year Level</th>
                        <th>Grade</th>
                        <th>Result</th>
                        <th>School Status</th>
                    </tr>
                </thead>

                <tbody id="reportsTable">

                    <tr>
                        <td colspan="7" class="loading">
                            Loading reports...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script type="module" src="../assets/js/admin-reports.js"></script>
<script type="module" src="../assets/js/ui-shell.js"></script>
<script type="module" src="../assets/js/pwa.js"></script>
<script type="module" src="../assets/js/theme.js"></script>

</body>
</html>
