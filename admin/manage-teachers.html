
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#635bff">

    <title>Manage Teachers | EqualLearn</title>

    <link rel="stylesheet" href="../assets/css/manage-teachers.css">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="stylesheet" href="../assets/css/equallearn.css">
    <link rel="icon" href="../assets/icons/icon-192.png">
</head>

<body>

    <div class="container">

        <h1>Manage Teachers</h1>

        <button id="openModal" type="button">
            ➕ Add Teacher
        </button>

        <button
            type="button"
            class="back-btn"
            onclick="window.location.href='dashboard.html'">
            ← Back
        </button>

        <div id="teacherList">
            Loading...
        </div>

    </div>

    <!-- ADD TEACHER MODAL -->
    <div class="modal" id="teacherModal">

        <div class="modal-content">

            <h2 id="modalTitle">Add Teacher</h2>

            <input
                id="email"
                type="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="new-password"
                required
            >

            <input
                id="department"
                type="text"
                placeholder="Department"
                required
            >

            <div class="buttons">

                <button id="saveTeacher" type="button">
                    Save
                </button>

                <button id="cancel" type="button">
                    Cancel
                </button>

            </div>

        </div>

    </div>

    <script type="module" src="../assets/js/admin-teachers.js"></script>
    <script type="module" src="../assets/js/ui-shell.js"></script>
    <script type="module" src="../assets/js/pwa.js"></script>
    <script type="module" src="../assets/js/theme.js"></script>

</body>
</html>
