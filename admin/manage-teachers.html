<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Manage Teachers | EqualLearn</title>

  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../assets/icons/equallearn-logo.png">

  <!-- Existing EqualLearn shell and design systems -->
  <link rel="stylesheet" href="../assets/css/glass-dashboard.css">
  <link rel="stylesheet" href="../assets/css/sidebar-skeuomorphism.css">
  <link rel="stylesheet" href="../assets/css/manage-teachers.css">

  <!-- Page-specific horizontal list design; loaded last to override legacy card styles -->
  <link rel="stylesheet" href="../assets/css/manage-teachers-modern.css?v=20261120">
</head>
<body>
  <main class="teacher-page" aria-label="Teacher directory">
    <div class="teacher-toolbar">
      <p class="teacher-description">Registered teaching accounts and their assigned departments.</p>

      <!-- New teacher creation is handled by the existing Register Teacher page. -->
      <a class="teacher-add-btn" href="register-teacher.html" id="registerTeacherLink">
        <span data-icon="plus" aria-hidden="true"></span>
        <span>Add Teacher</span>
      </a>
    </div>

    <section class="teacher-list-panel" aria-label="Registered teachers">
      <div id="teacherList" class="teacher-list" aria-live="polite">
        <div class="teacher-state">Loading teacher accounts...</div>
      </div>
    </section>
  </main>

  <!-- EDIT TEACHER MODAL: account creation now takes place on register-teacher.html -->
  <div class="teacher-modal" id="teacherModal" aria-hidden="true">
    <div class="teacher-modal-backdrop" data-close-modal></div>
    <section class="teacher-modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="teacher-modal-heading">
        <div>
          <p class="teacher-modal-kicker">TEACHER ACCOUNT</p>
          <h2 id="modalTitle">Edit teacher details</h2>
        </div>
        <button class="teacher-modal-close" type="button" id="closeTeacherModal" aria-label="Close edit dialog">&times;</button>
      </div>

      <p class="teacher-edit-identity" id="teacherEditIdentity">Update the department for this teacher.</p>

      <label class="teacher-field-label" for="department">Department</label>
      <input id="department" class="teacher-field" type="text" placeholder="Enter department" autocomplete="organization" required>

      <div class="teacher-modal-actions">
        <button class="teacher-cancel-btn" type="button" id="cancel">Cancel</button>
        <button class="teacher-save-btn" type="button" id="saveTeacher">Save changes</button>
      </div>
    </section>
  </div>

  <script type="module" src="../assets/js/admin-teachers.js"></script>
  <script type="module" src="../assets/js/ui-shell.js"></script>
  <script type="module" src="../assets/js/pwa.js"></script>
  <script type="module" src="../assets/js/theme.js"></script>

  <!-- EqualLearn Lumi companion -->
  <iframe
    src="/assets/widgets/lumi.html"
    title="Lumi — EqualLearn Companion"
    id="equallearn-lumi-frame"
    allow="autoplay"
    style="position:fixed;right:8px;bottom:8px;width:210px;height:255px;border:0;background:transparent;z-index:99999;overflow:hidden;pointer-events:auto;"
  ></iframe>
</body>
</html>
